name: Temporary Biome baseline diagnostics
on:
  push:
    branches:
      - fix/biome-site-owner-boundary-2026-11-05
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: |
          corepack enable pnpm
          corepack prepare pnpm@11.15.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Emit complete Biome diagnostics for targeted remediation
        continue-on-error: true
        run: pnpm exec biome check --max-diagnostics=300 .

      - name: Format only the five confirmed Biome violations
        run: |
          pnpm exec biome check --write \
            packages/invoices/src/pdf-browser.ts \
            packages/invoices/src/quote-pdf.test.ts \
            packages/invoices/src/quote-pdf.ts \
            scripts/check-growth-backlog.mjs \
            scripts/check-xero-roadmap.mjs
          for file in \
            packages/invoices/src/pdf-browser.ts \
            packages/invoices/src/quote-pdf.test.ts \
            packages/invoices/src/quote-pdf.ts \
            scripts/check-growth-backlog.mjs \
            scripts/check-xero-roadmap.mjs; do
            printf 'TAMMY_FMT_BEGIN|%s|\n' "$file"
            base64 -w0 "$file"
            printf '\n'
            printf 'TAMMY_FMT_END|%s|\n' "$file"
          done
