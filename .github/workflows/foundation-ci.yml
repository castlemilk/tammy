name: Offline desktop foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos14-arm64-packaged:
    name: macOS 14 arm64 packaged E2E
    # Measured slow comparison needs ~36m for setup, 19 cases, the unchanged
    # 8m SBR test deadline and 2m artifact reserve. See docs/development/ci-evidence.
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Assert native Apple silicon
        run: test "$(uname -m)" = "arm64"

      - name: Check out the complete comparison history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.4

      - name: Activate pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.15.0 --activate

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install exact Task
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          task_install_dir="$(mktemp -d "${RUNNER_TEMP%/}/tammy-task.XXXXXX")"
          trap 'rm -rf "$task_install_dir"' EXIT
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 120 --retry 0 \
            --output "$task_install_dir/task.tar.gz" \
            https://github.com/go-task/task/releases/download/v3.52.0/task_darwin_arm64.tar.gz
          printf '%s  %s\n' \
            debfa9a3bc06fcb5d5550b44725ecd22bb305499ce057bd6d7a774db5cdaa7b8 \
            "$task_install_dir/task.tar.gz" | shasum -a 256 --check --status
          tar -xzf "$task_install_dir/task.tar.gz" -C "$task_install_dir" task
          test -f "$task_install_dir/task" && test ! -L "$task_install_dir/task"
          chmod 755 "$task_install_dir/task"
          test "$("$task_install_dir/task" --version)" = "3.52.0"
          rm "$task_install_dir/task.tar.gz"
          printf '%s\n' "$task_install_dir" >> "$GITHUB_PATH"
          trap - EXIT

      - name: Verify exact Task version
        shell: bash
        run: test "$(task --version)" = "3.52.0"

      - name: Run canonical macOS CI scenario
        env:
          CSC_FOR_PULL_REQUEST: 'true'
        run: task ci:macos

      - name: Retain packaged failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos14-arm64-foundation-failure-evidence
          path: |
            apps/desktop/test-results/**
            apps/desktop/resources/build/build-manifest.json
          if-no-files-found: warn
          retention-days: 30
