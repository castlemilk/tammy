name: Tammy marketing site

on:
  workflow_dispatch:
    inputs:
      deploy_cloudflare:
        description: Deploy the verified direct Worker from master (no domain changes)
        type: boolean
        required: false
        default: false
  push:
    paths:
      - "AGENTS.md"
      - "apps/site/**"
      - "packages/invoices/**"
      - "package.json"
      - ".npmrc"
      - "tsconfig.base.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "scripts/site-*"
      - ".github/workflows/tammy-site.yml"
      - ".github/actionlint.yaml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "apps/site/**"
      - "packages/invoices/**"
      - "package.json"
      - ".npmrc"
      - "tsconfig.base.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "scripts/site-*"
      - ".github/workflows/tammy-site.yml"
      - ".github/actionlint.yaml"

permissions:
  contents: read

concurrency:
  group: tammy-site-${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-flight master publication when a newer commit arrives.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  verify-site:
    name: Typecheck, lint, test and build
    # Registration and qualification are tracked in issue #47 / draft PR #46.
    # Fork pull requests must never execute on the repo-scoped Cuttlefish pool.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, ARM64, tammy-linux-ci]
    timeout-minutes: 30
    steps:
      - name: Verify Cuttlefish Linux runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          test "${RUNNER_ARCH}" = ARM64
          test "$(uname -m)" = aarch64
          case "${RUNNER_NAME}" in
            cf-vm-*) ;;
            *) printf 'RUNNER_NOT_CUTTLEFISH: %s\n' "${RUNNER_NAME}" >&2; exit 1 ;;
          esac
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Use pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Use pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.15.0 --activate
      - name: Release preparation and provenance tests
        run: node --test scripts/site-release.test.mjs scripts/site-ci.test.mjs
      - name: Export the exact checked-out source and workspace dependencies
        run: node scripts/site-release.mjs prepare --output "$RUNNER_TEMP/tammy-site-source"
      - name: Install site dependencies from lockfile
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm install --frozen-lockfile --filter sites-project...
      - name: Site typecheck
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm --dir apps/site typecheck
      - name: Site lint
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm --dir apps/site lint
      - name: Shared invoice package typecheck
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm --dir packages/invoices typecheck
      - name: Invoice and quote PDF model tests
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm --dir packages/invoices test
      - name: Site tests
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm --dir apps/site test
      - name: Editorial MDX prose audit
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm --dir apps/site editorial:lint
      - name: SEO and canonical audit
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm --dir apps/site seo:check
      - name: Sites publication preflight contract tests
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm --dir apps/site site:preflight:test
      - name: Build and stage the Worker from the exported source
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm build
      - name: Verify source and Worker provenance
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: node scripts/site-release.mjs verify
      - name: Bundle source, Worker output and provenance
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: node scripts/site-release.mjs bundle --output "$RUNNER_TEMP/tammy-site-artifact"
      - name: Retain deployment preparation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tammy-site-preparation-${{ github.sha }}
          path: ${{ runner.temp }}/tammy-site-artifact/
          # Includes dist/.openai/hosting.json; the bundle excludes credentials,
          # Git metadata, dependency stores and node_modules.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Export a separate direct Cloudflare source candidate
        run: node scripts/site-release.mjs prepare --target cloudflare --output "$RUNNER_TEMP/tammy-cloudflare-source"
      - name: Install direct Worker dependencies without deployment credentials
        working-directory: ${{ runner.temp }}/tammy-cloudflare-source
        run: pnpm install --frozen-lockfile --filter sites-project...
      - name: Build and verify the direct Worker
        working-directory: ${{ runner.temp }}/tammy-cloudflare-source
        run: |
          pnpm build
          node scripts/site-release.mjs verify
      - name: Validate the direct Worker with Wrangler without deployment credentials
        working-directory: ${{ runner.temp }}/tammy-cloudflare-source
        run: node scripts/site-release.mjs cloudflare-dry-run --output "$RUNNER_TEMP/tammy-cloudflare-dry-run"
      - name: Bundle the direct Worker source, build and dry-run evidence
        working-directory: ${{ runner.temp }}/tammy-cloudflare-source
        run: |
          node scripts/site-release.mjs bundle --output "$RUNNER_TEMP/tammy-cloudflare-artifact"
          cp "$RUNNER_TEMP/tammy-cloudflare-dry-run/dry-run-record.json" "$RUNNER_TEMP/tammy-cloudflare-artifact/dry-run-record.json"
      - name: Retain the direct Cloudflare preparation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tammy-cloudflare-preparation-${{ github.sha }}
          path: ${{ runner.temp }}/tammy-cloudflare-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Record the preparation boundary
        shell: bash
        run: |
          {
            printf '## Tammy release preparation\n\n'
            printf 'Source commit: %s\n\n' "$GITHUB_SHA"
            printf 'Cuttlefish runner: %s (%s / %s)\n\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'Separate Sites and direct Cloudflare artifacts contain their source closure, Worker output and provenance.\n\n'
            printf 'This job does not publish. The separate Cloudflare deployment job is restricted to trusted master runs; it does not change tammy.tax or publish through Sites.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-cloudflare:
    name: Deploy verified direct Cloudflare Worker
    needs: verify-site
    # Only trusted master pushes, or explicit master dispatches, can publish.
    if: >-
      ${{ github.repository == 'castlemilk/tammy' &&
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.deploy_cloudflare)) }}
    runs-on: [self-hosted, linux, ARM64, tammy-linux-ci]
    timeout-minutes: 20
    concurrency:
      group: tammy-cloudflare-tammy-site-direct
      cancel-in-progress: false
    steps:
      - name: Verify Cuttlefish Linux runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          test "${RUNNER_ARCH}" = ARM64
          test "$(uname -m)" = aarch64
          case "${RUNNER_NAME}" in
            cf-vm-*) ;;
            *) printf 'RUNNER_NOT_CUTTLEFISH: %s\n' "${RUNNER_NAME}" >&2; exit 1 ;;
          esac
      - name: Download the verified direct artifact from this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: tammy-cloudflare-preparation-${{ github.sha }}
          path: ${{ runner.temp }}/tammy-cloudflare-artifact
      - name: Use pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Verify the downloaded revision and source archive
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          const artifact = path.join(process.env.RUNNER_TEMP, 'tammy-cloudflare-artifact');
          const read = (name) => JSON.parse(readFileSync(path.join(artifact, name), 'utf8'));
          const release = read('release-manifest.json');
          const source = read('source-provenance.json');
          const build = read('build-provenance.json');
          for (const record of [release, source, build]) {
            assert.equal(record.github.repository, 'castlemilk/tammy');
            assert.equal(record.github.commit_sha, process.env.GITHUB_SHA, 'Artifact must match this exact workflow revision');
            assert.equal(record.target, 'cloudflare', 'Sites output cannot be deployed directly');
          }
          assert.equal(release.source_archive.path, 'source.tar.gz');
          assert.equal(createHash('sha256').update(readFileSync(path.join(artifact, 'source.tar.gz'))).digest('hex'), release.source_archive.sha256);
          assert.equal(release.source_sha256, source.source_sha256);
          assert.equal(build.source_sha256, source.source_sha256);
          assert.equal(release.build_sha256, build.build_sha256);
          NODE
      - name: Restore and verify the exact source and Worker build
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/tammy-cloudflare-source"
          tar -xzf "$RUNNER_TEMP/tammy-cloudflare-artifact/source.tar.gz" -C "$RUNNER_TEMP/tammy-cloudflare-source"
          cp -R "$RUNNER_TEMP/tammy-cloudflare-artifact/dist" "$RUNNER_TEMP/tammy-cloudflare-source/dist"
          cp "$RUNNER_TEMP/tammy-cloudflare-artifact/build-provenance.json" "$RUNNER_TEMP/tammy-cloudflare-source/build-provenance.json"
          cd "$RUNNER_TEMP/tammy-cloudflare-source"
          node scripts/site-release.mjs verify
      - name: Use pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.15.0 --activate
      - name: Install dependencies without deployment credentials
        working-directory: ${{ runner.temp }}/tammy-cloudflare-source
        run: pnpm install --frozen-lockfile --filter sites-project...
      - name: Recheck the revision and build before publication
        working-directory: ${{ runner.temp }}/tammy-cloudflare-source
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; import {readFileSync} from "node:fs"; const source = JSON.parse(readFileSync("source-provenance.json", "utf8")); assert.equal(source.github.commit_sha, process.env.GITHUB_SHA); assert.equal(source.target, "cloudflare");'
          node scripts/site-release.mjs verify
      - name: Deploy the direct Worker with existing Cloudflare access
        id: deploy
        working-directory: ${{ runner.temp }}/tammy-cloudflare-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/site-release.mjs cloudflare-deploy --output "$RUNNER_TEMP/tammy-cloudflare-deployment"
      - name: Retain the deployment record
        if: ${{ always() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tammy-cloudflare-deployment-${{ github.sha }}-${{ github.run_attempt }}
          # Never upload Wrangler logs/output or any credential-bearing files.
          path: ${{ runner.temp }}/tammy-cloudflare-deployment/deployment-record.json
          if-no-files-found: ignore
          retention-days: 30
