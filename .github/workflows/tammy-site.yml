name: Tammy website
run-name: >-
  Tammy website · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }} · ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.deploy_cloudflare || inputs.deploy_vercel) && 'deploy' || 'verify' }}

on:
  workflow_dispatch:
    inputs:
      deploy_cloudflare:
        description: Deploy the verified direct Worker from master (no domain changes)
        type: boolean
        required: false
        default: false
      deploy_vercel:
        description: Deploy the verified static export from master to Vercel (serves tammy.tax)
        type: boolean
        required: false
        default: false
  push:
    # PR validation already covers branch pushes; publish only from master.
    branches: [master]
    paths:
      - "AGENTS.md"
      - "apps/site/**"
      - "packages/invoices/**"
      - "package.json"
      - ".npmrc"
      - "tsconfig.base.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "scripts/site-*"
      - ".github/workflows/tammy-site.yml"
      - ".github/actionlint.yaml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "apps/site/**"
      - "packages/invoices/**"
      - "package.json"
      - ".npmrc"
      - "tsconfig.base.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "scripts/site-*"
      - ".github/workflows/tammy-site.yml"
      - ".github/actionlint.yaml"

permissions:
  contents: read

concurrency:
  group: tammy-site-${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-flight master publication when a newer commit arrives.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  verify-site:
    name: Typecheck, lint, test and build
    # Registration and qualification are tracked in issue #47 / draft PR #46.
    # Fork pull requests must never execute on the repo-scoped Cuttlefish pool.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, ARM64, tammy-linux-ci]
    timeout-minutes: 30
    steps:
      - name: Verify Cuttlefish Linux runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          test "${RUNNER_ARCH}" = ARM64
          test "$(uname -m)" = aarch64
          case "${RUNNER_NAME}" in
            cf-vm-*) ;;
            *) printf 'RUNNER_NOT_CUTTLEFISH: %s\n' "${RUNNER_NAME}" >&2; exit 1 ;;
          esac
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Use pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Use pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.15.0 --activate
      - name: Release preparation and provenance tests
        run: node --test scripts/site-release.test.mjs scripts/site-ci.test.mjs
      - name: Export the exact checked-out source and workspace dependencies
        run: node scripts/site-release.mjs prepare --output "$RUNNER_TEMP/tammy-site-source"
      - name: Install site dependencies from lockfile
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm install --frozen-lockfile --filter sites-project...
      - name: Site typecheck
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm --dir apps/site typecheck
      - name: Site lint
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm --dir apps/site lint
      - name: Shared invoice package typecheck
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm --dir packages/invoices typecheck
      - name: Invoice and quote PDF model tests
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm --dir packages/invoices test
      - name: Site tests
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm --dir apps/site test
      - name: Editorial MDX prose audit
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm --dir apps/site editorial:lint
      - name: SEO and canonical audit
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm --dir apps/site seo:check
      - name: Sites publication preflight contract tests
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: node --test apps/site/scripts/live-site-preflight.test.mjs apps/site/scripts/verify-direct-deployment.test.mjs
      - name: Build and stage the Worker from the exported source
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: pnpm build
      - name: Verify source and Worker provenance
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: node scripts/site-release.mjs verify
      - name: Bundle source, Worker output and provenance
        working-directory: ${{ runner.temp }}/tammy-site-source
        run: node scripts/site-release.mjs bundle --output "$RUNNER_TEMP/tammy-site-artifact"
      - name: Retain deployment preparation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tammy-site-preparation-${{ github.sha }}
          path: ${{ runner.temp }}/tammy-site-artifact/
          # Includes dist/.openai/hosting.json; the bundle excludes credentials,
          # Git metadata, dependency stores and node_modules.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Export a separate direct Cloudflare source candidate
        run: node scripts/site-release.mjs prepare --target cloudflare --output "$RUNNER_TEMP/tammy-cloudflare-source"
      - name: Install direct Worker dependencies without deployment credentials
        working-directory: ${{ runner.temp }}/tammy-cloudflare-source
        run: pnpm install --frozen-lockfile --filter sites-project...
      - name: Build and verify the direct Worker
        working-directory: ${{ runner.temp }}/tammy-cloudflare-source
        run: |
          pnpm build
          node scripts/site-release.mjs verify
      - name: Validate the direct Worker with Wrangler without deployment credentials
        working-directory: ${{ runner.temp }}/tammy-cloudflare-source
        run: node scripts/site-release.mjs cloudflare-dry-run --output "$RUNNER_TEMP/tammy-cloudflare-dry-run"
      - name: Bundle the direct Worker source, build and dry-run evidence
        working-directory: ${{ runner.temp }}/tammy-cloudflare-source
        run: |
          node scripts/site-release.mjs bundle --output "$RUNNER_TEMP/tammy-cloudflare-artifact"
          cp "$RUNNER_TEMP/tammy-cloudflare-dry-run/dry-run-record.json" "$RUNNER_TEMP/tammy-cloudflare-artifact/dry-run-record.json"
      - name: Retain the direct Cloudflare preparation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tammy-cloudflare-preparation-${{ github.sha }}
          path: ${{ runner.temp }}/tammy-cloudflare-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Export a separate Vercel static candidate
        run: node scripts/site-release.mjs prepare --target vercel --output "$RUNNER_TEMP/tammy-vercel-source"
      - name: Install Vercel candidate dependencies without deployment credentials
        working-directory: ${{ runner.temp }}/tammy-vercel-source
        run: pnpm install --frozen-lockfile --filter sites-project...
      - name: Build and verify the Vercel static export
        working-directory: ${{ runner.temp }}/tammy-vercel-source
        run: |
          pnpm build
          node scripts/site-release.mjs verify
          node scripts/site-release.mjs vercel-output --output "$RUNNER_TEMP/tammy-vercel-output-check"
      - name: Bundle the Vercel source and static export
        working-directory: ${{ runner.temp }}/tammy-vercel-source
        run: node scripts/site-release.mjs bundle --output "$RUNNER_TEMP/tammy-vercel-artifact"
      - name: Retain the Vercel preparation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tammy-vercel-preparation-${{ github.sha }}
          path: ${{ runner.temp }}/tammy-vercel-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Record the preparation boundary
        shell: bash
        run: |
          {
            printf '## Tammy release preparation\n\n'
            printf 'Source commit: %s\n\n' "$GITHUB_SHA"
            printf 'Cuttlefish runner: %s (%s / %s)\n\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'Separate Sites and direct Cloudflare artifacts contain their source closure, Worker output and provenance.\n\n'
            printf 'This job does not publish. The separate Cloudflare and Vercel deployment jobs are restricted to trusted master runs. Only the Vercel job changes what tammy.tax serves; neither publishes through Sites.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-cloudflare:
    name: Deploy verified direct Cloudflare Worker
    needs: verify-site
    # Only trusted master pushes, or explicit master dispatches, can publish.
    if: >-
      ${{ github.repository == 'castlemilk/tammy' &&
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.deploy_cloudflare)) }}
    runs-on: [self-hosted, linux, ARM64, tammy-linux-ci]
    timeout-minutes: 20
    concurrency:
      group: tammy-cloudflare-tammy-site-direct
      cancel-in-progress: false
    steps:
      - name: Verify Cuttlefish Linux runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          test "${RUNNER_ARCH}" = ARM64
          test "$(uname -m)" = aarch64
          case "${RUNNER_NAME}" in
            cf-vm-*) ;;
            *) printf 'RUNNER_NOT_CUTTLEFISH: %s\n' "${RUNNER_NAME}" >&2; exit 1 ;;
          esac
      - name: Download the verified direct artifact from this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: tammy-cloudflare-preparation-${{ github.sha }}
          path: ${{ runner.temp }}/tammy-cloudflare-artifact
      - name: Use pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Verify the downloaded revision and source archive
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          const artifact = path.join(process.env.RUNNER_TEMP, 'tammy-cloudflare-artifact');
          const read = (name) => JSON.parse(readFileSync(path.join(artifact, name), 'utf8'));
          const release = read('release-manifest.json');
          const source = read('source-provenance.json');
          const build = read('build-provenance.json');
          for (const record of [release, source, build]) {
            assert.equal(record.github.repository, 'castlemilk/tammy');
            assert.equal(record.github.commit_sha, process.env.GITHUB_SHA, 'Artifact must match this exact workflow revision');
            assert.equal(record.target, 'cloudflare', 'Sites output cannot be deployed directly');
          }
          assert.equal(release.source_archive.path, 'source.tar.gz');
          assert.equal(createHash('sha256').update(readFileSync(path.join(artifact, 'source.tar.gz'))).digest('hex'), release.source_archive.sha256);
          assert.equal(release.source_sha256, source.source_sha256);
          assert.equal(build.source_sha256, source.source_sha256);
          assert.equal(release.build_sha256, build.build_sha256);
          NODE
      - name: Restore and verify the exact source and Worker build
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/tammy-cloudflare-source"
          tar -xzf "$RUNNER_TEMP/tammy-cloudflare-artifact/source.tar.gz" -C "$RUNNER_TEMP/tammy-cloudflare-source"
          cp -R "$RUNNER_TEMP/tammy-cloudflare-artifact/dist" "$RUNNER_TEMP/tammy-cloudflare-source/dist"
          cp "$RUNNER_TEMP/tammy-cloudflare-artifact/build-provenance.json" "$RUNNER_TEMP/tammy-cloudflare-source/build-provenance.json"
          cd "$RUNNER_TEMP/tammy-cloudflare-source"
          node scripts/site-release.mjs verify
      - name: Use pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.15.0 --activate
      - name: Install dependencies without deployment credentials
        working-directory: ${{ runner.temp }}/tammy-cloudflare-source
        run: pnpm install --frozen-lockfile --filter sites-project...
      - name: Recheck the revision and build before publication
        working-directory: ${{ runner.temp }}/tammy-cloudflare-source
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; import {readFileSync} from "node:fs"; const source = JSON.parse(readFileSync("source-provenance.json", "utf8")); assert.equal(source.github.commit_sha, process.env.GITHUB_SHA); assert.equal(source.target, "cloudflare");'
          node scripts/site-release.mjs verify
      - name: Deploy the direct Worker with existing Cloudflare access
        id: deploy
        working-directory: ${{ runner.temp }}/tammy-cloudflare-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/site-release.mjs cloudflare-deploy --output "$RUNNER_TEMP/tammy-cloudflare-deployment"
      - name: Check published direct routes and canonical metadata
        id: health
        working-directory: ${{ runner.temp }}/tammy-cloudflare-source
        run: >-
          node apps/site/scripts/verify-direct-deployment.mjs
          --record "$RUNNER_TEMP/tammy-cloudflare-deployment/deployment-record.json"
          --revision "$GITHUB_SHA"
          --output "$RUNNER_TEMP/tammy-cloudflare-deployment/live-verification.json"
      - name: Summarise publication and HTTP acceptance separately
        if: ${{ always() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure') }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          import path from 'node:path';
          const directory = path.join(process.env.RUNNER_TEMP, 'tammy-cloudflare-deployment');
          const read = (name) => {
            const file = path.join(directory, name);
            return existsSync(file) ? JSON.parse(readFileSync(file, 'utf8')) : null;
          };
          const deployment = read('deployment-record.json');
          const health = read('live-verification.json');
          const lines = [
            '## Tammy direct Worker', '',
            '| Evidence | Result |', '| --- | --- |',
            '| Git revision | ' + process.env.GITHUB_SHA + ' |',
            '| Publication | ' + (deployment?.status ?? 'No confirmed receipt') + ' |',
            '| Worker version | ' + (deployment?.version_id ?? 'Not confirmed') + ' |',
            '| URL | ' + (deployment?.url ?? 'Not confirmed') + ' |',
            '| HTTP acceptance | ' + (health ? (health.ok ? 'Passed' : 'Failed') : 'Not completed') + ' |',
            '| Source hash | ' + (deployment?.source_sha256 ?? 'Not recorded') + ' |',
            '| Build hash | ' + (deployment?.build_sha256 ?? 'Not recorded') + ' |', '',
            'HTTP acceptance does not replace browser/PDF checks or independent version readback. A failed health check does not undo publication.',
            'tammy.tax, Sites and DNS remain unchanged by this workflow.', '',
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          NODE
      - name: Retain the deployment record
        if: ${{ always() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tammy-cloudflare-deployment-${{ github.sha }}-${{ github.run_attempt }}
          # Never upload Wrangler logs/output or any credential-bearing files.
          path: |
            ${{ runner.temp }}/tammy-cloudflare-deployment/deployment-record.json
            ${{ runner.temp }}/tammy-cloudflare-deployment/live-verification.json
          if-no-files-found: ignore
          retention-days: 30

  deploy-vercel:
    name: Deploy verified static export to Vercel (tammy.tax)
    needs: verify-site
    # Only trusted master pushes, or explicit master dispatches, can publish, and
    # only once the repository variables naming the Vercel project exist.
    if: >-
      ${{ github.repository == 'castlemilk/tammy' &&
          github.ref == 'refs/heads/master' &&
          vars.VERCEL_PROJECT_ID != '' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.deploy_vercel)) }}
    runs-on: [self-hosted, linux, ARM64, tammy-linux-ci]
    timeout-minutes: 20
    concurrency:
      group: tammy-vercel-tammy-site
      cancel-in-progress: false
    steps:
      - name: Verify Cuttlefish Linux runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          test "${RUNNER_ARCH}" = ARM64
          test "$(uname -m)" = aarch64
          case "${RUNNER_NAME}" in
            cf-vm-*) ;;
            *) printf 'RUNNER_NOT_CUTTLEFISH: %s\n' "${RUNNER_NAME}" >&2; exit 1 ;;
          esac
      - name: Download the verified Vercel artifact from this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: tammy-vercel-preparation-${{ github.sha }}
          path: ${{ runner.temp }}/tammy-vercel-artifact
      - name: Use pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Verify the downloaded Vercel revision and source archive
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          const artifact = path.join(process.env.RUNNER_TEMP, 'tammy-vercel-artifact');
          const read = (name) => JSON.parse(readFileSync(path.join(artifact, name), 'utf8'));
          const release = read('release-manifest.json');
          const source = read('source-provenance.json');
          const build = read('build-provenance.json');
          for (const record of [release, source, build]) {
            assert.equal(record.github.repository, 'castlemilk/tammy');
            assert.equal(record.github.commit_sha, process.env.GITHUB_SHA, 'Artifact must match this exact workflow revision');
            assert.equal(record.target, 'vercel', 'Only the Vercel static export can be published to Vercel');
          }
          assert.equal(release.source_archive.path, 'source.tar.gz');
          assert.equal(createHash('sha256').update(readFileSync(path.join(artifact, 'source.tar.gz'))).digest('hex'), release.source_archive.sha256);
          assert.equal(release.source_sha256, source.source_sha256);
          assert.equal(build.source_sha256, source.source_sha256);
          assert.equal(release.build_sha256, build.build_sha256);
          NODE
      - name: Restore and verify the exact source and static export
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/tammy-vercel-source"
          tar -xzf "$RUNNER_TEMP/tammy-vercel-artifact/source.tar.gz" -C "$RUNNER_TEMP/tammy-vercel-source"
          cp -R "$RUNNER_TEMP/tammy-vercel-artifact/dist" "$RUNNER_TEMP/tammy-vercel-source/dist"
          cp "$RUNNER_TEMP/tammy-vercel-artifact/build-provenance.json" "$RUNNER_TEMP/tammy-vercel-source/build-provenance.json"
          cd "$RUNNER_TEMP/tammy-vercel-source"
          node scripts/site-release.mjs verify
      - name: Write the reviewed Vercel output
        working-directory: ${{ runner.temp }}/tammy-vercel-source
        run: node scripts/site-release.mjs vercel-output --output "$RUNNER_TEMP/tammy-vercel-output"
      - name: Deploy the static export to Vercel production with existing access
        id: deploy
        working-directory: ${{ runner.temp }}/tammy-vercel-source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: node scripts/site-release.mjs vercel-deploy --output "$RUNNER_TEMP/tammy-vercel-output"
      - name: Confirm tammy.tax serves this exact build
        id: live
        working-directory: ${{ runner.temp }}/tammy-vercel-source
        run: node scripts/site-release.mjs vercel-verify-live --output "$RUNNER_TEMP/tammy-vercel-output"
      - name: Check tammy.tax routes, canonicals and sitemap
        id: health
        working-directory: ${{ runner.temp }}/tammy-vercel-source
        run: node apps/site/scripts/live-site-preflight.mjs https://tammy.tax
      - name: Summarise the Vercel publication and HTTP acceptance
        if: ${{ always() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure') }}
        shell: bash
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          import path from 'node:path';
          const file = path.join(process.env.RUNNER_TEMP, 'tammy-vercel-output', 'deployment-record.json');
          const record = existsSync(file) ? JSON.parse(readFileSync(file, 'utf8')) : null;
          const health = process.env.HEALTH_OUTCOME;
          const live = process.env.LIVE_OUTCOME;
          const outcome = (value) => (value === 'success' ? 'Passed' : value === 'failure' ? 'Failed' : 'Not completed');
          const lines = [
            '## Tammy on Vercel (tammy.tax)', '',
            '| Evidence | Result |', '| --- | --- |',
            '| Git revision | ' + process.env.GITHUB_SHA + ' |',
            '| Publication | ' + (record?.status ?? 'No confirmed record') + ' |',
            '| Deployment | ' + (record?.deployment_id ?? 'Not confirmed') + ' |',
            '| URL | ' + (record?.url ?? 'Not confirmed') + ' |',
            '| tammy.tax serves this build | ' + outcome(live) + ' |',
            '| tammy.tax preflight | ' + outcome(health) + ' |',
            '| Static output hash | ' + (record?.static_sha256 ?? 'Not recorded') + ' |', '',
            'The preflight checks routes, indexability and canonical host; it does not replace browser or PDF checks. A failed preflight does not undo publication.', '',
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          NODE
      - name: Retain the Vercel deployment record
        if: ${{ always() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tammy-vercel-deployment-${{ github.sha }}-${{ github.run_attempt }}
          # Only the redacted record and the live check; never CLI logs or the uploaded output.
          path: |
            ${{ runner.temp }}/tammy-vercel-output/deployment-record.json
            ${{ runner.temp }}/tammy-vercel-output/live-verification.json
          if-no-files-found: ignore
          retention-days: 30
