name: Tammy product roadmaps

on:
  pull_request:
    paths:
      - 'docs/roadmap/**'
      - 'scripts/check-xero-roadmap.mjs'
      - 'scripts/check-growth-backlog.mjs'
      - '.github/workflows/xero-roadmap-ci.yml'
  push:
    branches:
      - master
      - 'docs/xero-replacement-roadmap-*'
      - 'docs/tammy-growth-funnel-*'
    paths:
      - 'docs/roadmap/**'
      - 'scripts/check-xero-roadmap.mjs'
      - 'scripts/check-growth-backlog.mjs'
      - '.github/workflows/xero-roadmap-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, ARM64, tammy-linux-ci]
    timeout-minutes: 5
    steps:
      - name: Verify Cuttlefish Linux runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          test "${RUNNER_ARCH}" = ARM64
          test "$(uname -m)" = aarch64
          case "${RUNNER_NAME}" in
            cf-vm-*) ;;
            *) printf 'RUNNER_NOT_CUTTLEFISH: %s\n' "${RUNNER_NAME}" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Validate roadmap data, dependencies, evidence and scope
        run: node scripts/check-xero-roadmap.mjs
      - name: Validate growth backlog, dependencies, SEO intent and release boundaries
        run: node scripts/check-growth-backlog.mjs
