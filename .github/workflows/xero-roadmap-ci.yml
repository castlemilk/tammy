name: Tammy Xero replacement roadmap

on:
  pull_request:
    paths:
      - 'docs/roadmap/**'
      - 'scripts/check-xero-roadmap.mjs'
      - '.github/workflows/xero-roadmap-ci.yml'
  push:
    branches:
      - master
      - 'docs/xero-replacement-roadmap-*'
    paths:
      - 'docs/roadmap/**'
      - 'scripts/check-xero-roadmap.mjs'
      - '.github/workflows/xero-roadmap-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Validate roadmap data, dependencies, evidence and scope
        run: node scripts/check-xero-roadmap.mjs
