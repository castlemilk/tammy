version: v2
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    revision: 1
    out: services/core/internal/gen
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go:v1.20.0
    revision: 1
    out: services/core/internal/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-es
    out: packages/connect-client/src/gen
    opt:
      - target=ts
      - import_extension=js
      - rewrite_imports=./buf/validate/validate_pb.js:@buf/bufbuild_protovalidate.bufbuild_es
inputs:
  - directory: proto
