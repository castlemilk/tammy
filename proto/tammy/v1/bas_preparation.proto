message BasPeriodSuggestion {
  BasCivilDateRange period = 1 [(buf.validate.field).required = true];
  BasPeriodWindow window = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  CivilDate nominal_due_date = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "bas.suggestion.due_calendar"
      message: "Nominal due date must exist in the Gregorian calendar"
      expression: "this.day <= (this.month == 2 ? ((this.year % 4 == 0 && (this.year % 100 != 0 || this.year % 400 == 0)) ? 29 : 28) : (this.month in [4, 6, 9, 11] ? 30 : 31))"
    }
  ];
  string due_date_rule_version = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  bytes due_date_rule_hash = 5 [(buf.validate.field).bytes.len = 32];
  optional SourceRef profile = 6 [(buf.validate.field).cel = {
    id: "bas.period_suggestion.profile_type"
    message: "Period suggestion profile reference must identify a BAS obligations profile"
    expression: "this.type == 'bas_obligations_profile'"
  }];
}

