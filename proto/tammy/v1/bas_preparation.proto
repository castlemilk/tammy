  rpc SaveBasPaygInputs(SaveBasPaygInputsRequest) returns (SaveBasPaygInputsResponse);
  rpc RegenerateBasPreparation(RegenerateBasPreparationRequest) returns (RegenerateBasPreparationResponse);
  rpc ValidateBasPreparation(ValidateBasPreparationRequest) returns (ValidateBasPreparationResponse);
  rpc AcknowledgeBasWarnings(AcknowledgeBasWarningsRequest) returns (AcknowledgeBasWarningsResponse);
  rpc FreezeBasForManualHandoff(FreezeBasForManualHandoffRequest) returns (FreezeBasForManualHandoffResponse);
  rpc CreateBasReplacement(CreateBasReplacementRequest) returns (CreateBasReplacementResponse);
  rpc CreateBasRevision(CreateBasRevisionRequest) returns (CreateBasRevisionResponse);
  rpc RecordExternalBasObservation(RecordExternalBasObservationRequest) returns (RecordExternalBasObservationResponse);
  rpc CorrectExternalBasObservation(CorrectExternalBasObservationRequest) returns (CorrectExternalBasObservationResponse);
  rpc ResolveExternalBasDispute(ResolveExternalBasDisputeRequest) returns (ResolveExternalBasDisputeResponse);
  rpc ReplaceRejectedBasAttempt(ReplaceRejectedBasAttemptRequest) returns (ReplaceRejectedBasAttemptResponse);
  rpc RecordBasExportEvent(RecordBasExportEventRequest) returns (RecordBasExportEventResponse);
