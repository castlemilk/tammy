  }];
  BasCadence cadence = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  BasPrefillRequirement prefill_requirement = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  repeated BasFormLabel confirmed_statement_labels = 5 [(buf.validate.field).repeated = {
    max_items: 4
    items: {
      enum: {
        defined_only: true
        not_in: 0
      }
    }
  }];
  repeated SourceRef statement_requirement_evidence = 6 [(buf.validate.field).repeated.max_items = 20];
  string reason = 7 [(buf.validate.field).string.max_len = 512];
}

message BasIncomeYearIdentity {
  string income_year_id = 1 [(buf.validate.field).string = {
    len: 36
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  }];
  BasCivilDateRange dates = 2 [(buf.validate.field).required = true];
  SourceRef confirmation = 3 [(buf.validate.field).required = true];
}

message BasPaygiProfileInput {
  option (buf.validate.message).cel = {
    id: "bas.profile.paygi_income_year"
    message: "An active amount or rate method is tied to a confirmed income year"
    expression: "(this.applicability.applicability == 2 && (this.method == 2 || this.method == 3) && has(this.confirmed_income_year)) || (this.applicability.applicability == 2 && (this.method == 1 || this.method == 5) && !has(this.confirmed_income_year)) || (this.applicability.applicability == 3 && this.method == 4 && !has(this.confirmed_income_year)) || this.applicability.applicability == 1"
  };
  BasObligationAnswer applicability = 1 [(buf.validate.field).required = true];
  BasPaygiMethod method = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  BasCadence cadence = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional BasIncomeYearIdentity confirmed_income_year = 4;
  repeated SourceRef evidence = 5 [(buf.validate.field).repeated.max_items = 20];
  string reason = 6 [(buf.validate.field).string.max_len = 512];
}

// BasObligationsProfileInput is one complete immutable revision of the organization's BAS scope.
message BasObligationsProfileInput {
  BasEffectiveInterval effective_interval = 1 [(buf.validate.field).required = true];
  BasGstProfileInput gst = 2 [(buf.validate.field).required = true];
  BasPaygwProfileInput paygw = 3 [(buf.validate.field).required = true];
  BasPaygiProfileInput paygi = 4 [(buf.validate.field).required = true];
  BasOtherObligationInventory other_obligations = 5 [(buf.validate.field).required = true];
  repeated SourceRef evidence = 6 [(buf.validate.field).repeated.max_items = 20];
  string reason = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

message BasObligationsProfile {
  string profile_id = 1 [(buf.validate.field).string = {
    len: 36
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  }];
  string organisation_id = 2 [(buf.validate.field).string = {
    len: 36
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  }];
  uint64 revision = 3 [(buf.validate.field).uint64.gte = 1];
  bytes content_hash = 4 [(buf.validate.field).bytes.len = 32];
  BasObligationsProfileInput profile = 5 [(buf.validate.field).required = true];
  optional SourceRef previous_profile = 6;
  string actor_user_id = 7 [(buf.validate.field).string = {
    len: 36
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  }];
  google.protobuf.Timestamp recorded_at = 8 [(buf.validate.field).required = true];
}

