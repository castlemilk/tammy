  rpc GetBasExternalObservation(GetBasExternalObservationRequest) returns (GetBasExternalObservationResponse);
  rpc ListBasExternalObservations(ListBasExternalObservationsRequest) returns (ListBasExternalObservationsResponse);
  rpc GetBasExternalDisputeResolution(GetBasExternalDisputeResolutionRequest) returns (GetBasExternalDisputeResolutionResponse);
  rpc ListBasExternalDisputeResolutions(ListBasExternalDisputeResolutionsRequest) returns (ListBasExternalDisputeResolutionsResponse);
  rpc ListBasExportEvents(ListBasExportEventsRequest) returns (ListBasExportEventsResponse);
  rpc SetBasObligationsProfile(SetBasObligationsProfileRequest) returns (SetBasObligationsProfileResponse);
