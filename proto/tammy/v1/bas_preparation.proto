// BasCivilDateRange contains inclusive Gregorian civil dates.
message BasCivilDateRange {
  option (buf.validate.message).cel = {
    id: "bas.date_range.order"
    message: "The inclusive end date must not precede the start date"
    expression: "this.start_date.year * 10000 + this.start_date.month * 100 + this.start_date.day <= this.end_date.year * 10000 + this.end_date.month * 100 + this.end_date.day"
  };
  CivilDate start_date = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "bas.date_range.start_calendar"
      message: "Start date must exist in the Gregorian calendar"
      expression: "this.day <= (this.month == 2 ? ((this.year % 4 == 0 && (this.year % 100 != 0 || this.year % 400 == 0)) ? 29 : 28) : (this.month in [4, 6, 9, 11] ? 30 : 31))"
    }
  ];
  CivilDate end_date = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "bas.date_range.end_calendar"
      message: "End date must exist in the Gregorian calendar"
      expression: "this.day <= (this.month == 2 ? ((this.year % 4 == 0 && (this.year % 100 != 0 || this.year % 400 == 0)) ? 29 : 28) : (this.month in [4, 6, 9, 11] ? 30 : 31))"
    }
  ];
}

// BasEffectiveInterval records when a profile assertion applies.
message BasEffectiveInterval {
  option (buf.validate.message).cel = {
    id: "bas.interval.order"
    message: "Effective end date must not precede its start date"
    expression: "!has(this.end_date) || this.start_date.year * 10000 + this.start_date.month * 100 + this.start_date.day <= this.end_date.year * 10000 + this.end_date.month * 100 + this.end_date.day"
  };
  CivilDate start_date = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "bas.interval.start_calendar"
      message: "Effective start date must exist in the Gregorian calendar"
      expression: "this.day <= (this.month == 2 ? ((this.year % 4 == 0 && (this.year % 100 != 0 || this.year % 400 == 0)) ? 29 : 28) : (this.month in [4, 6, 9, 11] ? 30 : 31))"
    }
  ];
  optional CivilDate end_date = 2 [(buf.validate.field).cel = {
    id: "bas.interval.end_calendar"
    message: "Effective end date must exist in the Gregorian calendar"
    expression: "this.day <= (this.month == 2 ? ((this.year % 4 == 0 && (this.year % 100 != 0 || this.year % 400 == 0)) ? 29 : 28) : (this.month in [4, 6, 9, 11] ? 30 : 31))"
  }];
}

// BasObligationAnswer retains one explicit activity-statement obligation decision.
message BasObligationAnswer {
  option (buf.validate.message).cel = {
    id: "bas.obligation.answer.review"
    message: "Active and not-applicable answers require a reason, and active answers require evidence"
    expression: "this.applicability == 1 || (this.applicability == 2 && size(this.reason) > 0 && this.evidence.size() > 0) || (this.applicability == 3 && size(this.reason) > 0)"
  };
  BasApplicability applicability = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  repeated SourceRef evidence = 2 [(buf.validate.field).repeated.max_items = 20];
  string reason = 3 [(buf.validate.field).string.max_len = 512];
}

// BasOtherObligationInventory prevents one reviewed flag from hiding unclassified statement sections.
message BasOtherObligationInventory {
  BasObligationAnswer fringe_benefits_tax = 1 [(buf.validate.field).required = true];
  BasObligationAnswer wine_equalisation_tax = 2 [(buf.validate.field).required = true];
  BasObligationAnswer luxury_car_tax = 3 [(buf.validate.field).required = true];
  BasObligationAnswer fuel_tax_credits = 4 [(buf.validate.field).required = true];
  BasObligationAnswer deferred_company_instalments = 5 [(buf.validate.field).required = true];
  BasObligationAnswer deferred_or_import_gst = 6 [(buf.validate.field).required = true];
  BasObligationAnswer special_gst_schemes_or_adjustments = 7 [(buf.validate.field).required = true];
  BasObligationAnswer other_activity_statement_obligations = 8 [(buf.validate.field).required = true];
}

message BasGstProfileInput {
  option (buf.validate.message).cel = {
    id: "bas.profile.gst_consistency"
    message: "GST registration, applicability and registration dates must be internally consistent"
    expression: "(this.applicability == 2 && this.registration_status == 2 && has(this.registration_interval)) || (this.applicability == 3 && this.registration_status == 3 && !has(this.registration_interval)) || (this.applicability == 1 && (this.registration_status == 1 || this.registration_status == 2 || this.registration_status == 3))"
  };
  BasApplicability applicability = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  BasRegistrationStatus registration_status = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  BasGstMethod reporting_method = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  BasTurnoverCategory turnover_category = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  BasGstBasis gst_basis = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  BasCadence cadence = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional BasEffectiveInterval registration_interval = 7;
  repeated SourceRef evidence = 8 [(buf.validate.field).repeated.max_items = 20];
  string reason = 9 [(buf.validate.field).string.max_len = 512];
}

message BasPaygwProfileInput {
  BasObligationAnswer applicability = 1 [(buf.validate.field).required = true];
  BasPaygwCategory category = 2 [(buf.validate.field).enum = {
