  option (buf.validate.message).cel = {
    id: "company_return_submission.attempt.outcome_state"
    message: "attempt outcome must match its durable state"
    expression: "(this.state in [1, 2, 3, 7] && !has(this.outcome)) || (this.state == 5 && has(this.outcome) && this.outcome == 4) || (this.state in [4, 6] && has(this.outcome) && this.outcome in [1, 2, 3])"
  };
  option (buf.validate.message).cel = {
    id: "company_return_submission.attempt.original_operation"
    message: "a durable attempt retains its original pre-lodge or lodge operation type"
    expression: "this.operation_type in [1, 2]"
  };
  option (buf.validate.message).cel = {
    id: "company_return_submission.attempt.retry_state"
    message: "retry classification must exactly match the durable attempt state"
    expression: "(this.state == 3 && this.retry_classification == 2) || (this.state == 5 && this.retry_classification == 3) || (this.state in [1, 2, 4, 6, 7] && this.retry_classification == 1)"
  };

  string id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
