    expression: "this.company_return.state == 10 ? (has(this.submission.receipt) && has(this.company_return.delivery) && this.submission.receipt.attempt_id == this.submission.latest_attempt.id && this.company_return.delivery.latest_attempt_id == this.submission.latest_attempt.id && this.company_return.delivery.operation_type == 2 && this.company_return.delivery.outcome == 1 && has(this.company_return.delivery.receipt_id) && this.company_return.delivery.receipt_id == this.submission.receipt.id && has(this.company_return.delivery.delivered_at)) : (!has(this.submission.receipt) && !has(this.company_return.delivery))"
  };

  CompanyReturn company_return = 1 [(buf.validate.field).required = true];
  CompanyReturnSubmission submission = 2 [(buf.validate.field).required = true];
}

message ReconcileUnknownCompanyReturnSubmissionRequest {
  option (buf.validate.message).cel = {
    id: "company_return_submission.reconcile.fresh_factor"
    message: "unknown-outcome reconciliation requires a purpose-bound fresh factor"
    expression: "has(this.command_context) && has(this.command_context.fresh_factor) && this.command_context.fresh_factor.purpose == 'company_return_reconcile_unknown'"
  };

  CommandContext command_context = 1 [(buf.validate.field).required = true];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string return_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string attempt_id = 4 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  uint64 expected_return_version = 5 [(buf.validate.field).uint64.gte = 1];
}

message ReconcileUnknownCompanyReturnSubmissionResponse {
  option (buf.validate.message).cel = {
    id: "company_return_submission.reconcile.identity"
    message: "response return identities must match"
    expression: "has(this.company_return) && has(this.submission) && has(this.submission.latest_attempt) && this.company_return.id == this.submission.return_id && this.company_return.id == this.submission.latest_attempt.return_id"
  };
  option (buf.validate.message).cel = {
    id: "company_return_submission.reconcile.matrix"
    message: "operation, attempt state, outcome, and report state must match the lifecycle authority"
    expression: "(this.submission.latest_attempt.operation_type == 1 && ((this.submission.latest_attempt.state in [1, 2, 4] && this.company_return.state == 5) || (this.submission.latest_attempt.state in [3, 7] && this.company_return.state == 4) || (this.submission.latest_attempt.state == 5 && this.company_return.state == 8) || (this.submission.latest_attempt.state == 6 && this.submission.latest_attempt.outcome == 1 && this.company_return.state == 7) || (this.submission.latest_attempt.state == 6 && this.submission.latest_attempt.outcome == 2 && this.company_return.state == 6) || (this.submission.latest_attempt.state == 6 && this.submission.latest_attempt.outcome == 3 && this.company_return.state == 2))) || (this.submission.latest_attempt.operation_type == 2 && ((this.submission.latest_attempt.state in [1, 2, 4] && this.company_return.state == 9) || (this.submission.latest_attempt.state in [3, 7] && this.company_return.state == 7) || (this.submission.latest_attempt.state == 5 && this.company_return.state == 12) || (this.submission.latest_attempt.state == 6 && this.submission.latest_attempt.outcome == 1 && this.company_return.state == 10) || (this.submission.latest_attempt.state == 6 && this.submission.latest_attempt.outcome == 3 && this.company_return.state == 11)))"
  };
  option (buf.validate.message).cel = {
    id: "company_return_submission.reconcile.receipt_state"
    message: "only an accepted delivered lodge has aligned receipt and delivery identities"
    expression: "this.company_return.state == 10 ? (has(this.submission.receipt) && has(this.company_return.delivery) && this.submission.receipt.attempt_id == this.submission.latest_attempt.id && this.company_return.delivery.latest_attempt_id == this.submission.latest_attempt.id && this.company_return.delivery.operation_type == 2 && this.company_return.delivery.outcome == 1 && has(this.company_return.delivery.receipt_id) && this.company_return.delivery.receipt_id == this.submission.receipt.id && has(this.company_return.delivery.delivered_at)) : (!has(this.submission.receipt) && !has(this.company_return.delivery))"
  };

  CompanyReturn company_return = 1 [(buf.validate.field).required = true];
  CompanyReturnSubmission submission = 2 [(buf.validate.field).required = true];
}

service CompanyReturnSubmissionService {
  rpc PreLodgeCompanyReturn(PreLodgeCompanyReturnRequest) returns (PreLodgeCompanyReturnResponse);
  rpc LodgeCompanyReturn(LodgeCompanyReturnRequest) returns (LodgeCompanyReturnResponse);
  rpc GetCompanyReturnSubmission(GetCompanyReturnSubmissionRequest) returns (GetCompanyReturnSubmissionResponse);
  rpc RefreshCompanyReturnStatus(RefreshCompanyReturnStatusRequest) returns (RefreshCompanyReturnStatusResponse);
  rpc ReconcileUnknownCompanyReturnSubmission(ReconcileUnknownCompanyReturnSubmissionRequest) returns (ReconcileUnknownCompanyReturnSubmissionResponse);
}
