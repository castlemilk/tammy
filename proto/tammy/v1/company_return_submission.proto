  string declaration_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  bytes report_snapshot_hash = 4 [(buf.validate.field).bytes.len = 32];
  bytes official_payload_hash = 5 [(buf.validate.field).bytes.len = 32];
  SubmissionEnvironment environment = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  bytes product_identifier_fingerprint = 7 [(buf.validate.field).bytes.len = 32];
  string service_id = 8 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$"
  }];
  CompanyReturnOperationType operation_type = 9 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string operation_id = 10 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string idempotency_identity = 11 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  CompanyReturnAttemptState state = 12 [(buf.validate.field).enum = {
