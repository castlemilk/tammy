service CompanyTaxService {
  rpc GetCompanyTaxProfile(GetCompanyTaxProfileRequest) returns (GetCompanyTaxProfileResponse);
  rpc SetCompanyTaxProfile(SetCompanyTaxProfileRequest) returns (SetCompanyTaxProfileResponse);
  rpc CreateCompanyReturn(CreateCompanyReturnRequest) returns (CreateCompanyReturnResponse);
  rpc GetCompanyReturn(GetCompanyReturnRequest) returns (GetCompanyReturnResponse);
  rpc ListCompanyReturnFacts(ListCompanyReturnFactsRequest) returns (ListCompanyReturnFactsResponse);
  rpc SetCompanyReturnInput(SetCompanyReturnInputRequest) returns (SetCompanyReturnInputResponse);
  rpc UpsertTaxAdjustment(UpsertTaxAdjustmentRequest) returns (UpsertTaxAdjustmentResponse);
  rpc RemoveTaxAdjustment(RemoveTaxAdjustmentRequest) returns (RemoveTaxAdjustmentResponse);
  rpc UpsertTaxElection(UpsertTaxElectionRequest) returns (UpsertTaxElectionResponse);
  rpc RemoveTaxElection(RemoveTaxElectionRequest) returns (RemoveTaxElectionResponse);
  rpc ValidateCompanyReturn(ValidateCompanyReturnRequest) returns (ValidateCompanyReturnResponse);
  rpc AcknowledgeReturnWarning(AcknowledgeReturnWarningRequest) returns (AcknowledgeReturnWarningResponse);
  rpc DeclareCompanyReturn(DeclareCompanyReturnRequest) returns (DeclareCompanyReturnResponse);
  rpc WithdrawCompanyReturnDeclaration(WithdrawCompanyReturnDeclarationRequest) returns (WithdrawCompanyReturnDeclarationResponse);
  rpc ExportCompanyReturnPack(ExportCompanyReturnPackRequest) returns (ExportCompanyReturnPackResponse);
  rpc CreateCompanyReturnReplacement(CreateCompanyReturnReplacementRequest) returns (CreateCompanyReturnReplacementResponse);
  rpc CreateCompanyReturnAmendment(CreateCompanyReturnAmendmentRequest) returns (CreateCompanyReturnAmendmentResponse);
}
