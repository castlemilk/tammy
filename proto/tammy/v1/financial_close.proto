edition = "2023";

package tammy.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "tammy/v1/common.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/tammyapp/tammy/services/core/internal/gen/tammy/v1;tammyv1";

// FinancialCloseState is the persisted lifecycle of one mutable financial-close aggregate.
enum FinancialCloseState {
  // FINANCIAL_CLOSE_STATE_UNSPECIFIED indicates that no valid close state was supplied.
  FINANCIAL_CLOSE_STATE_UNSPECIFIED = 0;
  // FINANCIAL_CLOSE_STATE_COLLECTING accepts source and resolution changes.
  FINANCIAL_CLOSE_STATE_COLLECTING = 1;
  // FINANCIAL_CLOSE_STATE_BLOCKED records deterministic close blockers.
  FINANCIAL_CLOSE_STATE_BLOCKED = 2;
  // FINANCIAL_CLOSE_STATE_REVIEW_READY has passed deterministic validation and can be frozen.
  FINANCIAL_CLOSE_STATE_REVIEW_READY = 3;
  // FINANCIAL_CLOSE_STATE_FROZEN retains an immutable, addressable close snapshot.
  FINANCIAL_CLOSE_STATE_FROZEN = 4;
}

// CloseCheckSeverity identifies whether one close check blocks freezing.
enum CloseCheckSeverity {
  // CLOSE_CHECK_SEVERITY_UNSPECIFIED indicates that no supported severity was supplied.
  CLOSE_CHECK_SEVERITY_UNSPECIFIED = 0;
  // CLOSE_CHECK_SEVERITY_BLOCKER prevents the financial close from being frozen.
  CLOSE_CHECK_SEVERITY_BLOCKER = 1;
  // CLOSE_CHECK_SEVERITY_WARNING requires explicit resolution before freezing.
  CLOSE_CHECK_SEVERITY_WARNING = 2;
}

// CloseCheckResult is the bounded outcome of one deterministic close rule.
enum CloseCheckResult {
  // CLOSE_CHECK_RESULT_UNSPECIFIED indicates that no supported result was supplied.
  CLOSE_CHECK_RESULT_UNSPECIFIED = 0;
  // CLOSE_CHECK_RESULT_FAILED indicates that the rule currently fails.
  CLOSE_CHECK_RESULT_FAILED = 1;
  // CLOSE_CHECK_RESULT_PASSED indicates that the rule currently passes.
  CLOSE_CHECK_RESULT_PASSED = 2;
  // CLOSE_CHECK_RESULT_RESOLVED indicates that a warning was explicitly resolved.
  CLOSE_CHECK_RESULT_RESOLVED = 3;
}

// FinancialStatementKind identifies one bounded rendered financial statement.
enum FinancialStatementKind {
  // FINANCIAL_STATEMENT_KIND_UNSPECIFIED indicates that no supported statement kind was supplied.
  FINANCIAL_STATEMENT_KIND_UNSPECIFIED = 0;
  // FINANCIAL_STATEMENT_KIND_PROFIT_AND_LOSS is the profit and loss statement.
  FINANCIAL_STATEMENT_KIND_PROFIT_AND_LOSS = 1;
  // FINANCIAL_STATEMENT_KIND_BALANCE_SHEET is the balance sheet.
  FINANCIAL_STATEMENT_KIND_BALANCE_SHEET = 2;
  // FINANCIAL_STATEMENT_KIND_CASH_FLOW is the cash flow statement.
  FINANCIAL_STATEMENT_KIND_CASH_FLOW = 3;
  // FINANCIAL_STATEMENT_KIND_TRIAL_BALANCE is the trial balance.
  FINANCIAL_STATEMENT_KIND_TRIAL_BALANCE = 4;
  // FINANCIAL_STATEMENT_KIND_GENERAL_LEDGER is the general ledger report.
  FINANCIAL_STATEMENT_KIND_GENERAL_LEDGER = 5;
  // FINANCIAL_STATEMENT_KIND_GST_DETAIL is the GST detail report.
  FINANCIAL_STATEMENT_KIND_GST_DETAIL = 6;
  // FINANCIAL_STATEMENT_KIND_FIXED_ASSET_SCHEDULE is the fixed asset schedule.
  FINANCIAL_STATEMENT_KIND_FIXED_ASSET_SCHEDULE = 7;
  // FINANCIAL_STATEMENT_KIND_FRANKING_RECONCILIATION is the franking reconciliation.
  FINANCIAL_STATEMENT_KIND_FRANKING_RECONCILIATION = 8;
}

// CloseCheck is one deterministic close rule result pinned to source revisions.
message CloseCheck {
  option (buf.validate.message).cel = {
    id: "financial_close.close_check.resolution_tuple"
    message: "resolution, resolved_by_user_id, and resolved_at must be present together only for a resolved check"
    expression: "this.result == 3 ? (has(this.resolution) && has(this.resolved_by_user_id) && has(this.resolved_at)) : (!has(this.resolution) && !has(this.resolved_by_user_id) && !has(this.resolved_at))"
  };

  // id is the opaque UUIDv7 check identifier.
  string id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // close_id identifies the owning financial close.
  string close_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // rule_id is the stable bounded rule code.
  string rule_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // severity identifies whether the check blocks freezing.
  CloseCheckSeverity severity = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  // result is the current bounded outcome.
  CloseCheckResult result = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  // source_revision pins the financial source revision checked.
  uint64 source_revision = 6 [(buf.validate.field).uint64.gte = 1];
  // affected_sources identifies at most 100 immutable source records.
  repeated SourceRef affected_sources = 7 [(buf.validate.field).repeated.max_items = 100];
  // resolution is the bounded human resolution for a resolved warning.
  string resolution = 8 [
    features.field_presence = EXPLICIT,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 2000
    }
  ];
  // resolved_by_user_id identifies the user who resolved the warning.
  string resolved_by_user_id = 9 [
    features.field_presence = EXPLICIT,
    (buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  ];
  // resolved_at is the core-authored resolution instant.
  google.protobuf.Timestamp resolved_at = 10;
}

// StatementHash binds one statement kind to its exact rendered content hash.
message StatementHash {
  // kind identifies the rendered statement.
  FinancialStatementKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  // content_hash is the exact 32-byte SHA-256 digest of the rendered statement.
  bytes content_hash = 2 [(buf.validate.field).bytes.len = 32];
}

// FinancialStatementApproval records the exact statements and wording approved by a user.
message FinancialStatementApproval {
  option (buf.validate.message).cel = {
    id: "financial_close.approval.period"
    message: "approval period must be 2025-07-01 through 2026-06-30"
    expression: "has(this.period_start) && this.period_start.year == 2025 && this.period_start.month == 7 && this.period_start.day == 1 && has(this.period_end) && this.period_end.year == 2026 && this.period_end.month == 6 && this.period_end.day == 30"
  };

  // id is the opaque UUIDv7 approval identifier.
  string id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // period_start is the inclusive first civil date approved.
  CivilDate period_start = 2 [(buf.validate.field).required = true];
  // period_end is the inclusive final civil date approved.
  CivilDate period_end = 3 [(buf.validate.field).required = true];
  // financial_revision pins the approved working financial revision.
  uint64 financial_revision = 4 [(buf.validate.field).uint64.gte = 1];
  // approval_wording_version identifies the bounded core-owned wording version.
  string approval_wording_version = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // approval_wording_hash is the exact 32-byte hash of the approved wording.
  bytes approval_wording_hash = 6 [(buf.validate.field).bytes.len = 32];
  // statement_hashes identifies every statement approved by content hash.
  repeated StatementHash statement_hashes = 7 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 16
  }];
  // approved_by_user_id identifies the approving user.
  string approved_by_user_id = 8 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // fresh_factor_assertion_id pins the single-use factor assertion consumed by approval.
  string fresh_factor_assertion_id = 9 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // approved_at is the core-authored approval instant.
  google.protobuf.Timestamp approved_at = 10 [(buf.validate.field).required = true];
}

// SourceRevision pins one bounded subledger owner to immutable content.
message SourceRevision {
  // owner is the stable bounded source owner code.
  string owner = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // revision is the immutable source revision and begins at one.
  uint64 revision = 2 [(buf.validate.field).uint64.gte = 1];
  // content_hash is the exact 32-byte SHA-256 digest of the source content.
  bytes content_hash = 3 [(buf.validate.field).bytes.len = 32];
}

// FinancialCloseSnapshot is the immutable evidence boundary for one frozen close.
message FinancialCloseSnapshot {
  option (buf.validate.message).cel = {
    id: "financial_close.snapshot.period"
    message: "snapshot period must be 2025-07-01 through 2026-06-30"
    expression: "has(this.period_start) && this.period_start.year == 2025 && this.period_start.month == 7 && this.period_start.day == 1 && has(this.period_end) && this.period_end.year == 2026 && this.period_end.month == 6 && this.period_end.day == 30"
  };

  // id is the opaque UUIDv7 snapshot identifier.
  string id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // close_id identifies the owning financial close.
  string close_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // organisation_id identifies the owning organisation.
  string organisation_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // verified_abn is the exact verified 11-digit Australian Business Number.
  string verified_abn = 4 [(buf.validate.field).string.pattern = "^[0-9]{11}$"];
  // income_year is the only supported company income year.
  int32 income_year = 5 [(buf.validate.field).int32.const = 2026];
  // period_start is the inclusive first civil date frozen.
  CivilDate period_start = 6 [(buf.validate.field).required = true];
  // period_end is the inclusive final civil date frozen.
  CivilDate period_end = 7 [(buf.validate.field).required = true];
  // currency is the only supported reporting currency.
  string currency = 8 [(buf.validate.field).string.const = "AUD"];
  // snapshot_hash is the exact 32-byte hash of this canonical snapshot.
  bytes snapshot_hash = 9 [(buf.validate.field).bytes.len = 32];
  // financial_revision pins the complete frozen financial inputs.
  uint64 financial_revision = 10 [(buf.validate.field).uint64.gte = 1];
  // subledger_revisions pins at most 32 contributing source owners.
  repeated SourceRevision subledger_revisions = 11 [(buf.validate.field).repeated.max_items = 32];
  // statement_hashes contains every frozen statement hash.
  repeated StatementHash statement_hashes = 12 [(buf.validate.field).repeated = {
    min_items: 4
    max_items: 16
  }];
  // trial_balance_hash is the exact 32-byte frozen trial-balance hash.
  bytes trial_balance_hash = 13 [(buf.validate.field).bytes.len = 32];
  // checklist_hash is the exact 32-byte frozen checklist hash.
  bytes checklist_hash = 14 [(buf.validate.field).bytes.len = 32];
  // reconciliation_hash is the exact 32-byte frozen reconciliation hash.
  bytes reconciliation_hash = 15 [(buf.validate.field).bytes.len = 32];
  // accounting_rule_fingerprint pins the exact accounting rule bundle.
  bytes accounting_rule_fingerprint = 16 [(buf.validate.field).bytes.len = 32];
  // gst_rule_fingerprint pins the exact GST rule bundle.
  bytes gst_rule_fingerprint = 17 [(buf.validate.field).bytes.len = 32];
  // asset_rule_fingerprint pins the exact fixed-asset rule bundle.
  bytes asset_rule_fingerprint = 18 [(buf.validate.field).bytes.len = 32];
  // evidence_manifest_hash is the exact 32-byte retained-evidence manifest hash.
  bytes evidence_manifest_hash = 19 [(buf.validate.field).bytes.len = 32];
  // audit_head_hash pins the exact 32-byte audit chain head.
  bytes audit_head_hash = 20 [(buf.validate.field).bytes.len = 32];
  // approval records the exact user approval frozen into this snapshot.
  FinancialStatementApproval approval = 21 [(buf.validate.field).required = true];
  // corrects_close_id identifies the frozen close corrected by this snapshot, when any.
  string corrects_close_id = 22 [
    features.field_presence = EXPLICIT,
    (buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  ];
  // frozen_at is the core-authored freeze instant.
  google.protobuf.Timestamp frozen_at = 23 [(buf.validate.field).required = true];
}

// FinancialClose is one mutable company financial-close aggregate.
message FinancialClose {
  option (buf.validate.message).cel = {
    id: "financial_close.period"
    message: "financial close period must be 2025-07-01 through 2026-06-30"
    expression: "has(this.period_start) && this.period_start.year == 2025 && this.period_start.month == 7 && this.period_start.day == 1 && has(this.period_end) && this.period_end.year == 2026 && this.period_end.month == 6 && this.period_end.day == 30"
  };
  option (buf.validate.message).cel = {
    id: "financial_close.frozen_snapshot_revision"
    message: "a frozen close requires a snapshot whose snapshot and approval revisions match the close"
    expression: "this.state != 4 || (has(this.latest_frozen_snapshot) && has(this.latest_frozen_snapshot.approval) && this.latest_frozen_snapshot.financial_revision == this.financial_revision && this.latest_frozen_snapshot.approval.financial_revision == this.financial_revision)"
  };

  // id is the opaque UUIDv7 financial-close identifier.
  string id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // organisation_id identifies the owning organisation.
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // income_year is the only supported company income year.
  int32 income_year = 3 [(buf.validate.field).int32.const = 2026];
  // period_start is the inclusive first civil date of the close.
  CivilDate period_start = 4 [(buf.validate.field).required = true];
  // period_end is the inclusive final civil date of the close.
  CivilDate period_end = 5 [(buf.validate.field).required = true];
  // currency is the only supported reporting currency.
  string currency = 6 [(buf.validate.field).string.const = "AUD"];
  // version is the monotonic optimistic-concurrency version.
  uint64 version = 7 [(buf.validate.field).uint64.gte = 1];
  // state is the current bounded close lifecycle state.
  FinancialCloseState state = 8 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  // financial_revision pins the current complete working financial inputs.
  uint64 financial_revision = 9 [(buf.validate.field).uint64.gte = 1];
  // latest_frozen_snapshot retains the latest immutable snapshot when one exists.
  FinancialCloseSnapshot latest_frozen_snapshot = 10;
  // created_at is the core-authored creation instant.
  google.protobuf.Timestamp created_at = 11 [(buf.validate.field).required = true];
  // updated_at is the core-authored latest mutation instant.
  google.protobuf.Timestamp updated_at = 12 [(buf.validate.field).required = true];
}

// FinancialStatementLine is one bounded rendered statement line with immutable provenance.
message FinancialStatementLine {
  option (buf.validate.message).cel = {
    id: "financial_close.statement_line.aud"
    message: "financial statement line amounts must use AUD"
    expression: "!has(this.amount) || this.amount.currency_code == 'AUD'"
  };

  // stable_code is the bounded stable semantic line code.
  string stable_code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // label is bounded safe presentation text.
  string label = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  // amount is the exact signed amount in Australian dollars.
  Money amount = 3 [(buf.validate.field).required = true];
  // sources contains at most 100 immutable provenance records.
  repeated SourceRef sources = 4 [(buf.validate.field).repeated.max_items = 100];
}

// FinancialStatement is one bounded rendered statement.
message FinancialStatement {
  // kind identifies the rendered statement.
  FinancialStatementKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  // content_hash is the exact 32-byte hash of the rendered statement.
  bytes content_hash = 2 [(buf.validate.field).bytes.len = 32];
  // lines contains at most 2,000 rendered statement lines.
  repeated FinancialStatementLine lines = 3 [(buf.validate.field).repeated.max_items = 2000];
}

// FinancialStatements is the bounded rendered statement set for one immutable snapshot.
message FinancialStatements {
  // close_id identifies the owning financial close.
  string close_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // snapshot_id identifies the exact immutable snapshot rendered.
  string snapshot_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // financial_revision pins the rendered financial inputs.
  uint64 financial_revision = 3 [(buf.validate.field).uint64.gte = 1];
  // statements contains the bounded required statement set.
  repeated FinancialStatement statements = 4 [(buf.validate.field).repeated = {
    min_items: 4
    max_items: 8
  }];
}

// CreateFinancialCloseRequest creates the single supported company close period.
message CreateFinancialCloseRequest {
  option (buf.validate.message).cel = {
    id: "financial_close.create.period"
    message: "financial close period must be 2025-07-01 through 2026-06-30"
    expression: "has(this.period_start) && this.period_start.year == 2025 && this.period_start.month == 7 && this.period_start.day == 1 && has(this.period_end) && this.period_end.year == 2026 && this.period_end.month == 6 && this.period_end.day == 30"
  };

  // command_context carries authorization and idempotency metadata.
  CommandContext command_context = 1 [(buf.validate.field).required = true];
  // organisation_id identifies the owning organisation.
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // income_year is the only supported company income year.
  int32 income_year = 3 [(buf.validate.field).int32.const = 2026];
  // period_start is the inclusive first civil date requested.
  CivilDate period_start = 4 [(buf.validate.field).required = true];
  // period_end is the inclusive final civil date requested.
  CivilDate period_end = 5 [(buf.validate.field).required = true];
}

// CreateFinancialCloseResponse returns the created close.
message CreateFinancialCloseResponse {
  // close is the created bounded close aggregate.
  FinancialClose close = 1 [(buf.validate.field).required = true];
}

// GetFinancialCloseRequest requests one organisation-owned close.
message GetFinancialCloseRequest {
  // authentication identifies the principal with financial-close read permission.
  AuthenticationContext authentication = 1 [(buf.validate.field).required = true];
  // organisation_id identifies the owning organisation.
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // close_id identifies the requested financial close.
  string close_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}

// GetFinancialCloseResponse returns one organisation-owned close.
message GetFinancialCloseResponse {
  // close is the requested bounded close aggregate.
  FinancialClose close = 1 [(buf.validate.field).required = true];
}

// ListCloseChecksRequest requests one stable bounded page of close checks.
message ListCloseChecksRequest {
  // authentication identifies the principal with financial-close read permission.
  AuthenticationContext authentication = 1 [(buf.validate.field).required = true];
  // organisation_id identifies the owning organisation.
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // close_id identifies the requested financial close.
  string close_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // page requests a bounded stable page.
  PageRequest page = 4 [(buf.validate.field).required = true];
}

// ListCloseChecksResponse returns one stable bounded page of close checks.
message ListCloseChecksResponse {
  // checks contains at most 200 close checks.
  repeated CloseCheck checks = 1 [(buf.validate.field).repeated.max_items = 200];
  // page describes the returned stable page.
  PageInfo page = 2 [(buf.validate.field).required = true];
}

// ResolveCloseWarningRequest resolves one warning with bounded human reasoning.
message ResolveCloseWarningRequest {
  // command_context carries authorization and idempotency metadata.
  CommandContext command_context = 1 [(buf.validate.field).required = true];
  // organisation_id identifies the owning organisation.
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // close_id identifies the financial close to mutate.
  string close_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // expected_version is the required optimistic-concurrency version.
  uint64 expected_version = 4 [(buf.validate.field).uint64.gte = 1];
  // check_id identifies the warning check to resolve.
  string check_id = 5 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // resolution is the bounded human resolution.
  string resolution = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2000
  }];
}

// ResolveCloseWarningResponse returns the bounded mutation projection.
message ResolveCloseWarningResponse {
  // close is the updated financial close.
  FinancialClose close = 1 [(buf.validate.field).required = true];
  // check is the resolved warning check.
  CloseCheck check = 2 [(buf.validate.field).required = true];
}

// FreezeFinancialCloseRequest freezes one review-ready close with fresh-factor authorization.
message FreezeFinancialCloseRequest {
  option (buf.validate.message).cel = {
    id: "financial_close.freeze.fresh_factor"
    message: "freeze requires a fresh factor reserved for financial_close_freeze"
    expression: "has(this.command_context) && has(this.command_context.fresh_factor) && this.command_context.fresh_factor.purpose == 'financial_close_freeze'"
  };

  // command_context carries authorization, idempotency, and the fresh factor.
  CommandContext command_context = 1 [(buf.validate.field).required = true];
  // organisation_id identifies the owning organisation.
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // close_id identifies the financial close to freeze.
  string close_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // expected_version is the required optimistic-concurrency version.
  uint64 expected_version = 4 [(buf.validate.field).uint64.gte = 1];
}

// FreezeFinancialCloseResponse returns the frozen close and immutable snapshot.
message FreezeFinancialCloseResponse {
  // close is the updated frozen financial close.
  FinancialClose close = 1 [(buf.validate.field).required = true];
  // snapshot is the immutable close snapshot created by the mutation.
  FinancialCloseSnapshot snapshot = 2 [(buf.validate.field).required = true];
}

// ReopenFinancialCloseRequest reopens one frozen close with fresh-factor authorization.
message ReopenFinancialCloseRequest {
  option (buf.validate.message).cel = {
    id: "financial_close.reopen.fresh_factor"
    message: "reopen requires a fresh factor reserved for financial_close_reopen"
    expression: "has(this.command_context) && has(this.command_context.fresh_factor) && this.command_context.fresh_factor.purpose == 'financial_close_reopen'"
  };

  // command_context carries authorization, idempotency, and the fresh factor.
  CommandContext command_context = 1 [(buf.validate.field).required = true];
  // organisation_id identifies the owning organisation.
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // close_id identifies the frozen financial close to reopen.
  string close_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // expected_version is the required optimistic-concurrency version.
  uint64 expected_version = 4 [(buf.validate.field).uint64.gte = 1];
  // reason is the bounded human reason for reopening.
  string reason = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2000
  }];
}

// ReopenFinancialCloseResponse returns the reopened close and preserved snapshot identifier.
message ReopenFinancialCloseResponse {
  // close is the reopened collecting close.
  FinancialClose close = 1 [(buf.validate.field).required = true];
  // preserved_snapshot_id identifies the immutable snapshot retained by reopening.
  string preserved_snapshot_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}

// StartFinancialCloseCorrectionRequest creates a correction close with fresh-factor authorization.
message StartFinancialCloseCorrectionRequest {
  option (buf.validate.message).cel = {
    id: "financial_close.start_correction.fresh_factor"
    message: "starting a correction requires a fresh factor reserved for financial_close_start_correction"
    expression: "has(this.command_context) && has(this.command_context.fresh_factor) && this.command_context.fresh_factor.purpose == 'financial_close_start_correction'"
  };

  // command_context carries authorization, idempotency, and the fresh factor.
  CommandContext command_context = 1 [(buf.validate.field).required = true];
  // organisation_id identifies the owning organisation.
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // close_id identifies the frozen financial close to correct.
  string close_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // expected_version is the required optimistic-concurrency version.
  uint64 expected_version = 4 [(buf.validate.field).uint64.gte = 1];
  // reason is the bounded human reason for correction.
  string reason = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2000
  }];
}

// StartFinancialCloseCorrectionResponse returns the original and new correction closes.
message StartFinancialCloseCorrectionResponse {
  // original_close is the preserved frozen close.
  FinancialClose original_close = 1 [(buf.validate.field).required = true];
  // correction_close is the new collecting correction close.
  FinancialClose correction_close = 2 [(buf.validate.field).required = true];
}

// GetFinancialStatementsRequest requests statements for one exact immutable snapshot.
message GetFinancialStatementsRequest {
  // authentication identifies the principal with financial-close read permission.
  AuthenticationContext authentication = 1 [(buf.validate.field).required = true];
  // organisation_id identifies the owning organisation.
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // close_id identifies the requested financial close.
  string close_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // snapshot_id identifies the exact immutable snapshot to render.
  string snapshot_id = 4 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}

// GetFinancialStatementsResponse returns the bounded rendered statement set.
message GetFinancialStatementsResponse {
  // statements is the bounded rendered statement set for the requested snapshot.
  FinancialStatements statements = 1 [(buf.validate.field).required = true];
}

// FinancialCloseService exposes the bounded company financial-close workflow.
service FinancialCloseService {
  // CreateFinancialClose creates the single supported company close period.
  rpc CreateFinancialClose(CreateFinancialCloseRequest) returns (CreateFinancialCloseResponse);
  // GetFinancialClose returns one organisation-owned close.
  rpc GetFinancialClose(GetFinancialCloseRequest) returns (GetFinancialCloseResponse);
  // ListCloseChecks returns one stable bounded page of close checks.
  rpc ListCloseChecks(ListCloseChecksRequest) returns (ListCloseChecksResponse);
  // ResolveCloseWarning records the explicit resolution of one warning.
  rpc ResolveCloseWarning(ResolveCloseWarningRequest) returns (ResolveCloseWarningResponse);
  // FreezeFinancialClose freezes one review-ready close into an immutable snapshot.
  rpc FreezeFinancialClose(FreezeFinancialCloseRequest) returns (FreezeFinancialCloseResponse);
  // ReopenFinancialClose reopens one frozen close while retaining its latest snapshot.
  rpc ReopenFinancialClose(ReopenFinancialCloseRequest) returns (ReopenFinancialCloseResponse);
  // StartFinancialCloseCorrection creates a correction close from one frozen close.
  rpc StartFinancialCloseCorrection(StartFinancialCloseCorrectionRequest) returns (StartFinancialCloseCorrectionResponse);
  // GetFinancialStatements returns bounded rendered statements for one immutable snapshot.
  rpc GetFinancialStatements(GetFinancialStatementsRequest) returns (GetFinancialStatementsResponse);
}
