syntax = "proto3";

package tammy.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "tammy/v1/accounting.proto";
import "tammy/v1/common.proto";
import "tammy/v1/organisation.proto";

option go_package = "github.com/tammyapp/tammy/services/core/internal/gen/tammy/v1;tammyv1";

// InvoiceState describes a document, not a ledger posting or delivery status.
enum InvoiceState {
  INVOICE_STATE_UNSPECIFIED = 0;
  INVOICE_STATE_DRAFT = 1;
  INVOICE_STATE_ISSUED = 2;
}

// InvoiceLineInput stores exact AUD ex-GST prices and three-decimal quantities.
message InvoiceLineInput {
  string description = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  uint32 quantity_milli = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000000
  }];
  int64 unit_price_minor = 3 [(buf.validate.field).int64 = {
    gte: 0
    lte: 100000000
  }];
  optional int64 unit_cost_minor = 4 [(buf.validate.field).int64 = {
    gte: 0
    lte: 100000000
  }];
  TaxTreatment tax_treatment = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string source_document_id = 6 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}

// InvoiceDraft permits incomplete customer details until explicit issue.
message InvoiceDraft {
  string number = 1 [(buf.validate.field).string.max_len = 40];
  string issue_date = 2 [(buf.validate.field).string.max_len = 10];
  string due_date = 3 [(buf.validate.field).string.max_len = 10];
  string customer_name = 4 [(buf.validate.field).string.max_len = 200];
  string customer_address = 5 [(buf.validate.field).string.max_len = 1000];
  string customer_abn = 6 [(buf.validate.field).string.max_len = 11];
  string seller_address = 7 [(buf.validate.field).string.max_len = 1000];
  // gst_registered is a user assertion; organisation verification does not verify it.
  bool gst_registered = 8;
  string notes = 9 [(buf.validate.field).string.max_len = 2000];
  string payment_instructions = 10 [(buf.validate.field).string.max_len = 1000];
  repeated InvoiceLineInput lines = 11 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
  }];
}

message InvoiceLineTotal {
  int64 subtotal_minor = 1 [(buf.validate.field).int64 = {
    gte: 0
    lte: 1000000000000
  }];
  int64 gst_minor = 2 [(buf.validate.field).int64 = {
    gte: 0
    lte: 1000000000000
  }];
  int64 total_minor = 3 [(buf.validate.field).int64 = {
    gte: 0
    lte: 1000000000000
  }];
  optional int64 cost_minor = 4 [(buf.validate.field).int64 = {
    gte: 0
    lte: 1000000000000
  }];
}

message Invoice {
  string id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  uint64 version = 3 [(buf.validate.field).uint64.gte = 1];
  InvoiceState state = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string seller_name = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string seller_abn = 6 [(buf.validate.field).string.len = 11];
  InvoiceDraft draft = 7 [(buf.validate.field).required = true];
  repeated InvoiceLineTotal line_totals = 8 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
  }];
  int64 subtotal_minor = 9;
  int64 gst_minor = 10;
  int64 total_minor = 11;
  // cost_minor sums only explicitly known internal costs, never customer charges.
  int64 cost_minor = 12;
  google.protobuf.Timestamp created_at = 13 [(buf.validate.field).required = true];
  google.protobuf.Timestamp updated_at = 14 [(buf.validate.field).required = true];
  // logo_asset_id is the reviewed immutable logo snapshot, never current branding.
  optional string logo_asset_id = 15 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}

message SaveInvoiceDraftRequest {
  CommandContext command_context = 1 [(buf.validate.field).required = true];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  // Empty invoice_id and expected_version zero create a draft.
  string invoice_id = 3 [(buf.validate.field).string.max_len = 36];
  uint64 expected_version = 4;
  InvoiceDraft draft = 5 [(buf.validate.field).required = true];
  // Omission preserves an existing draft's logo. Empty explicitly removes it.
  optional string logo_asset_id = 6 [(buf.validate.field).string.max_len = 36];
}
message SaveInvoiceDraftResponse {
  Invoice invoice = 1 [(buf.validate.field).required = true];
}
message GetInvoiceRequest {
  AuthenticationContext authentication = 1 [(buf.validate.field).required = true];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string invoice_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}
message GetInvoiceResponse {
  Invoice invoice = 1 [(buf.validate.field).required = true];
}
message ListInvoicesRequest {
  AuthenticationContext authentication = 1 [(buf.validate.field).required = true];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  PageRequest page = 3 [(buf.validate.field).required = true];
}
message ListInvoicesResponse {
  repeated Invoice invoices = 1 [(buf.validate.field).repeated.max_items = 200];
  PageInfo page = 2 [(buf.validate.field).required = true];
}
message IssueInvoiceRequest {
  CommandContext command_context = 1 [(buf.validate.field).required = true];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string invoice_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  uint64 expected_version = 4 [(buf.validate.field).uint64.gte = 1];
}
message IssueInvoiceResponse {
  Invoice invoice = 1 [(buf.validate.field).required = true];
}

// InvoiceTemplateInput initializes future invoices; it never rewrites saved documents.
message InvoiceTemplateInput {
  string seller_address = 1 [(buf.validate.field).string.max_len = 1000];
  string notes = 2 [(buf.validate.field).string.max_len = 2000];
  string payment_instructions = 3 [(buf.validate.field).string.max_len = 1000];
  uint32 payment_terms_days = 4 [(buf.validate.field).uint32.lte = 365];
  optional string logo_asset_id = 5 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}

// Version zero denotes the unsaved built-in defaults (14-day payment terms).
message InvoiceTemplate {
  string organisation_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  uint64 version = 2;
  InvoiceTemplateInput defaults = 3 [(buf.validate.field).required = true];
}
message GetInvoiceTemplateRequest {
  AuthenticationContext authentication = 1 [(buf.validate.field).required = true];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}
message GetInvoiceTemplateResponse {
  InvoiceTemplate template = 1 [(buf.validate.field).required = true];
}
message SaveInvoiceTemplateRequest {
  CommandContext command_context = 1 [(buf.validate.field).required = true];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  uint64 expected_version = 3;
  InvoiceTemplateInput defaults = 4 [(buf.validate.field).required = true];
}
message SaveInvoiceTemplateResponse {
  InvoiceTemplate template = 1 [(buf.validate.field).required = true];
}

// Logo metadata is safe to include without adding image bytes to invoice lists.
message InvoiceLogo {
  string id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string mime_type = 3 [(buf.validate.field).string = {
    in: [
      "image/png",
      "image/jpeg"
    ]
  }];
  uint32 byte_length = 4 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1048576
  }];
  bytes sha256 = 5 [(buf.validate.field).bytes.len = 32];
  uint32 width = 6 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 4096
  }];
  uint32 height = 7 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 4096
  }];
  google.protobuf.Timestamp created_at = 8 [(buf.validate.field).required = true];
}
message UploadInvoiceLogoRequest {
  CommandContext command_context = 1 [(buf.validate.field).required = true];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string mime_type = 3 [(buf.validate.field).string = {
    in: [
      "image/png",
      "image/jpeg"
    ]
  }];
  bytes content = 4 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 1048576
  }];
}
message UploadInvoiceLogoResponse {
  InvoiceLogo logo = 1 [(buf.validate.field).required = true];
}
message GetInvoiceLogoRequest {
  AuthenticationContext authentication = 1 [(buf.validate.field).required = true];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string logo_asset_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}
message GetInvoiceLogoResponse {
  InvoiceLogo logo = 1 [(buf.validate.field).required = true];
  bytes content = 2 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 1048576
  }];
}

// Immutable dated receipts belong to the accounting link, not the invoice document.
message InvoicePayment {
  string id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string invoice_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  CivilDate payment_date = 4 [(buf.validate.field).required = true];
  Money amount = 5 [(buf.validate.field).required = true];
  Money allocated_gst = 6 [(buf.validate.field).required = true];
  Money bas_sales_gross = 7 [(buf.validate.field).required = true];
  string bank_account_id = 8 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string reference = 9 [(buf.validate.field).string.max_len = 200];
  string journal_id = 10 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  google.protobuf.Timestamp created_at = 11 [(buf.validate.field).required = true];
}

// Version zero denotes an invoice not yet linked to business accounts.
message InvoiceAccounting {
  string invoice_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  uint64 version = 3;
  bool posted = 4;
  optional string revenue_account_id = 5 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  optional string journal_id = 6 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  GstBasis gst_basis = 7 [(buf.validate.field).enum.defined_only = true];
  int64 received_minor = 8 [(buf.validate.field).int64.gte = 0];
  int64 outstanding_minor = 9 [(buf.validate.field).int64.gte = 0];
  repeated InvoicePayment payments = 10 [(buf.validate.field).repeated.max_items = 200];
  uint64 payment_count = 11;
}
message GetInvoiceAccountingRequest {
  AuthenticationContext authentication = 1 [(buf.validate.field).required = true];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string invoice_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}
message GetInvoiceAccountingResponse {
  InvoiceAccounting accounting = 1 [(buf.validate.field).required = true];
}
message PostInvoiceIncomeRequest {
  CommandContext command_context = 1 [(buf.validate.field).required = true];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string invoice_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  uint64 expected_version = 4 [(buf.validate.field).uint64.gte = 1];
}
message PostInvoiceIncomeResponse {
  InvoiceAccounting accounting = 1 [(buf.validate.field).required = true];
}
message RecordInvoicePaymentRequest {
  CommandContext command_context = 1 [(buf.validate.field).required = true];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string invoice_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  uint64 expected_accounting_version = 4 [(buf.validate.field).uint64.gte = 1];
  CivilDate payment_date = 5 [(buf.validate.field).required = true];
  Money amount = 6 [(buf.validate.field).required = true];
  string bank_account_id = 7 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string reference = 8 [(buf.validate.field).string.max_len = 200];
}
message RecordInvoicePaymentResponse {
  InvoiceAccounting accounting = 1 [(buf.validate.field).required = true];
  InvoicePayment payment = 2 [(buf.validate.field).required = true];
}

// Period activity and outstanding debt use separate dates to retain older debt.
message BusinessIncomeSummary {
  string organisation_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  CivilDate period_start = 2 [(buf.validate.field).required = true];
  CivilDate period_end = 3 [(buf.validate.field).required = true];
  CivilDate as_of_date = 4 [(buf.validate.field).required = true];
  Money business_income = 5 [(buf.validate.field).required = true];
  Money invoice_income = 6 [(buf.validate.field).required = true];
  Money payments_received = 7 [(buf.validate.field).required = true];
  Money outstanding = 8 [(buf.validate.field).required = true];
  Money invoice_gst = 9 [(buf.validate.field).required = true];
  uint64 issued_count = 10;
  uint64 unposted_issued_count = 11;
  GstBasis gst_basis = 12 [(buf.validate.field).enum.defined_only = true];
  uint64 financial_revision = 13;
  Money unposted_income = 14 [(buf.validate.field).required = true];
}
message GetBusinessIncomeSummaryRequest {
  AuthenticationContext authentication = 1 [(buf.validate.field).required = true];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  CivilDate period_start = 3 [(buf.validate.field).required = true];
  CivilDate period_end = 4 [(buf.validate.field).required = true];
  CivilDate as_of_date = 5 [(buf.validate.field).required = true];
}
message GetBusinessIncomeSummaryResponse {
  BusinessIncomeSummary summary = 1 [(buf.validate.field).required = true];
}

service InvoiceService {
  rpc SaveInvoiceDraft(SaveInvoiceDraftRequest) returns (SaveInvoiceDraftResponse);
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse);
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
  // Issue freezes the document and atomically records income. It never sends it or records payment.
  rpc IssueInvoice(IssueInvoiceRequest) returns (IssueInvoiceResponse);
  rpc GetInvoiceTemplate(GetInvoiceTemplateRequest) returns (GetInvoiceTemplateResponse);
  rpc SaveInvoiceTemplate(SaveInvoiceTemplateRequest) returns (SaveInvoiceTemplateResponse);
  rpc UploadInvoiceLogo(UploadInvoiceLogoRequest) returns (UploadInvoiceLogoResponse);
  rpc GetInvoiceLogo(GetInvoiceLogoRequest) returns (GetInvoiceLogoResponse);
  rpc GetInvoiceAccounting(GetInvoiceAccountingRequest) returns (GetInvoiceAccountingResponse);
  rpc PostInvoiceIncome(PostInvoiceIncomeRequest) returns (PostInvoiceIncomeResponse);
  rpc RecordInvoicePayment(RecordInvoicePaymentRequest) returns (RecordInvoicePaymentResponse);
  rpc GetBusinessIncomeSummary(GetBusinessIncomeSummaryRequest) returns (GetBusinessIncomeSummaryResponse);
}
