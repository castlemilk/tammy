      id: "AttributePurchaseGstRequest.release_posting_date.calendar"
      message: "Date must exist in the Gregorian calendar"
      expression: "this.day <= (this.month == 2 ? ((this.year % 4 == 0 && (this.year % 100 != 0 || this.year % 400 == 0)) ? 29 : 28) : (this.month in [4, 6, 9, 11] ? 30 : 31))"
    }
  ];
  PurchaseClaimTimingReview timing_review = 8 [(buf.validate.field).required = true];
  optional string deferral_id = 9 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}

message AttributePurchaseGstResponse {
  repeated PurchaseGstAttribution attributions = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 200
  }];
  Journal journal = 2 [(buf.validate.field).required = true];
  PurchaseAccounting accounting = 3 [(buf.validate.field).required = true];
}

message DeferPurchaseGstClaimRequest {
  option (buf.validate.message).cel = {
    id: "purchase.deferral.mechanical_timing"
    message: "Deferral requires evidence available by review and an unexpired individual deadline"
    expression: "this.portions.all(p, (p.evidence_held_date.year * 10000 + p.evidence_held_date.month * 100 + p.evidence_held_date.day) <= (this.timing_review.reviewed_as_of.year * 10000 + this.timing_review.reviewed_as_of.month * 100 + this.timing_review.reviewed_as_of.day) && (this.timing_review.reviewed_as_of.year * 10000 + this.timing_review.reviewed_as_of.month * 100 + this.timing_review.reviewed_as_of.day) <= (p.ordinary_last_claim_date.year * 10000 + p.ordinary_last_claim_date.month * 100 + p.ordinary_last_claim_date.day))"
  };
  CommandContext command_context = 1 [(buf.validate.field).required = true];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string document_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  uint64 expected_accounting_version = 4 [(buf.validate.field).uint64.gte = 1];
  repeated PurchaseGstSourcePortion portions = 5 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 200
  }];
  PurchaseClaimPeriod affected_period = 6 [(buf.validate.field).required = true];
  PurchaseClaimTimingReview timing_review = 7 [(buf.validate.field).required = true];
  string reason = 8 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

message DeferPurchaseGstClaimResponse {
  PurchaseGstDeferral deferral = 1 [(buf.validate.field).required = true];
  PurchaseAccounting accounting = 2 [(buf.validate.field).required = true];
}

message ResolveLegacyPurchaseReviewRequest {
  CommandContext command_context = 1 [(buf.validate.field).required = true];
  string organisation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  LegacyPurchaseReviewInput review = 3 [(buf.validate.field).required = true];
}

message ResolveLegacyPurchaseReviewResponse {
  LegacyPurchaseReview review = 1 [(buf.validate.field).required = true];
}

service PurchaseService {
  rpc GetPurchaseAccounting(GetPurchaseAccountingRequest) returns (GetPurchaseAccountingResponse);
  rpc PostReviewedPurchase(PostReviewedPurchaseRequest) returns (PostReviewedPurchaseResponse);
  rpc RecordPurchasePayment(RecordPurchasePaymentRequest) returns (RecordPurchasePaymentResponse);
  rpc ListPurchasePayments(ListPurchasePaymentsRequest) returns (ListPurchasePaymentsResponse);
  rpc RecordPurchaseTaxEvidence(RecordPurchaseTaxEvidenceRequest) returns (RecordPurchaseTaxEvidenceResponse);
  rpc AttributePurchaseGst(AttributePurchaseGstRequest) returns (AttributePurchaseGstResponse);
  rpc DeferPurchaseGstClaim(DeferPurchaseGstClaimRequest) returns (DeferPurchaseGstClaimResponse);
  rpc ResolveLegacyPurchaseReview(ResolveLegacyPurchaseReviewRequest) returns (ResolveLegacyPurchaseReviewResponse);
}
