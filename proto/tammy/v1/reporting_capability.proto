edition = "2023";

package tammy.v1;

import "buf/validate/validate.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/tammyapp/tammy/services/core/internal/gen/tammy/v1;tammyv1";

// ReportingCapabilityStatus describes the exact reporting action available in this build.
enum ReportingCapabilityStatus {
  // REPORTING_CAPABILITY_STATUS_UNSPECIFIED indicates that no capability status was supplied.
  REPORTING_CAPABILITY_STATUS_UNSPECIFIED = 0;

  // REPORTING_CAPABILITY_STATUS_AVAILABLE indicates that the named report is available.
  REPORTING_CAPABILITY_STATUS_AVAILABLE = 1;

  // REPORTING_CAPABILITY_STATUS_PREPARATION_ONLY indicates that only report preparation is available.
  REPORTING_CAPABILITY_STATUS_PREPARATION_ONLY = 2;

  // REPORTING_CAPABILITY_STATUS_HANDOFF_ONLY indicates that only an external handoff is available.
  REPORTING_CAPABILITY_STATUS_HANDOFF_ONLY = 3;

  // REPORTING_CAPABILITY_STATUS_DIRECT_LODGEMENT indicates that direct lodgement is available.
  REPORTING_CAPABILITY_STATUS_DIRECT_LODGEMENT = 4;

  // REPORTING_CAPABILITY_STATUS_UNSUPPORTED indicates that the named report is unavailable.
  REPORTING_CAPABILITY_STATUS_UNSUPPORTED = 5;
}

// ReportingCapabilityMode identifies one independently available reporting workflow mode.
enum ReportingCapabilityMode {
  // REPORTING_CAPABILITY_MODE_UNSPECIFIED indicates that no mode was supplied.
  REPORTING_CAPABILITY_MODE_UNSPECIFIED = 0;

  // REPORTING_CAPABILITY_MODE_PREPARATION covers local return preparation and validation.
  REPORTING_CAPABILITY_MODE_PREPARATION = 1;

  // REPORTING_CAPABILITY_MODE_SIMULATOR covers deterministic local delivery simulation.
  REPORTING_CAPABILITY_MODE_SIMULATOR = 2;

  // REPORTING_CAPABILITY_MODE_EVTE covers official external validation test environment delivery.
  REPORTING_CAPABILITY_MODE_EVTE = 3;

  // REPORTING_CAPABILITY_MODE_PRODUCTION covers official production delivery.
  REPORTING_CAPABILITY_MODE_PRODUCTION = 4;
}

// ReportingModeAvailability describes the exact implementation boundary for one mode.
enum ReportingModeAvailability {
  // REPORTING_MODE_AVAILABILITY_UNSPECIFIED indicates that no availability was supplied.
  REPORTING_MODE_AVAILABILITY_UNSPECIFIED = 0;

  // REPORTING_MODE_AVAILABILITY_NOT_IMPLEMENTED means required Tammy behavior is absent.
  REPORTING_MODE_AVAILABILITY_NOT_IMPLEMENTED = 1;

  // REPORTING_MODE_AVAILABILITY_AVAILABLE means the current build implements the mode.
  REPORTING_MODE_AVAILABILITY_AVAILABLE = 2;

  // REPORTING_MODE_AVAILABILITY_EXTERNAL_GATED means Tammy implements the mode but an external prerequisite remains.
  REPORTING_MODE_AVAILABILITY_EXTERNAL_GATED = 3;
}

// ReportingEntityType identifies the Australian entity class requesting a report.
enum ReportingEntityType {
  // REPORTING_ENTITY_TYPE_UNSPECIFIED indicates that no entity type was supplied.
  REPORTING_ENTITY_TYPE_UNSPECIFIED = 0;

  // REPORTING_ENTITY_TYPE_AU_BUSINESS identifies an Australian business entity.
  REPORTING_ENTITY_TYPE_AU_BUSINESS = 1;

  // REPORTING_ENTITY_TYPE_AU_INDIVIDUAL identifies an Australian individual.
  REPORTING_ENTITY_TYPE_AU_INDIVIDUAL = 2;

  // REPORTING_ENTITY_TYPE_AU_PRIVATE_COMPANY identifies an Australian private company.
  REPORTING_ENTITY_TYPE_AU_PRIVATE_COMPANY = 3;
}

// ReportKind identifies one reporting product boundary.
enum ReportKind {
  // REPORT_KIND_UNSPECIFIED indicates that no report kind was supplied.
  REPORT_KIND_UNSPECIFIED = 0;

  // REPORT_KIND_GST_WORKPAPER identifies Tammy's local reviewed-document GST workpaper.
  REPORT_KIND_GST_WORKPAPER = 1;

  // REPORT_KIND_BAS identifies a complete business activity statement.
  REPORT_KIND_BAS = 2;

  // REPORT_KIND_INDIVIDUAL_INCOME_TAX_RETURN identifies an individual income tax return.
  REPORT_KIND_INDIVIDUAL_INCOME_TAX_RETURN = 3;

  // REPORT_KIND_COMPANY_TAX_RETURN identifies an Australian company income tax return.
  REPORT_KIND_COMPANY_TAX_RETURN = 4;
}

// GetReportingCapabilityRequest asks about one exact report, entity, and tax year combination.
message GetReportingCapabilityRequest {
  // report identifies the exact report kind.
  ReportKind report = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];

  // tax_year identifies the requested four-digit Australian tax year.
  int32 tax_year = 2 [(buf.validate.field).int32 = {
    gte: 2000
    lte: 9999
  }];

  // entity_type identifies the exact Australian entity class.
  ReportingEntityType entity_type = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
}

// ReportingModeCapability describes one independently fail-closed reporting mode.
message ReportingModeCapability {
  // mode identifies the reporting workflow mode.
  ReportingCapabilityMode mode = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];

  // availability identifies the current build's exact implementation boundary.
  ReportingModeAvailability availability = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];

  // required_bundle_id identifies the bounded rules bundle required by this mode.
  string required_bundle_id = 3 [
    features.field_presence = EXPLICIT,
    (buf.validate.field).string = {
      max_len: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$"
    }
  ];

  // activated_bundle_fingerprint identifies the exact installed bundle only when activated.
  bytes activated_bundle_fingerprint = 4 [
    features.field_presence = EXPLICIT,
    (buf.validate.field).bytes.len = 32
  ];

  // required_service_name names the official external service required by this mode.
  string required_service_name = 5 [
    features.field_presence = EXPLICIT,
    (buf.validate.field).string.max_len = 128
  ];

  // summary is bounded user-facing text describing this mode's support boundary.
  string summary = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];

  // blockers are bounded stable codes explaining why this mode is unavailable.
  repeated string blockers = 7 [(buf.validate.field).repeated = {
    max_items: 16
    items: {
      string: {
        min_len: 1
        max_len: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$"
      }
    }
  }];
}

// ReportingCapability reports the immutable support boundary for one exact request and build.
message ReportingCapability {
  option (buf.validate.message).cel = {
    id: "reporting_capability.exact_modes"
    message: "modes must contain exactly one preparation, simulator, EVTE, and production entry"
    expression: "this.modes.size() == 4 && this.modes.filter(m, m.mode == 1).size() == 1 && this.modes.filter(m, m.mode == 2).size() == 1 && this.modes.filter(m, m.mode == 3).size() == 1 && this.modes.filter(m, m.mode == 4).size() == 1"
  };
  // report echoes the requested report kind.
  ReportKind report = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];

  // tax_year echoes the requested four-digit Australian tax year.
  int32 tax_year = 2 [(buf.validate.field).int32 = {
    gte: 2000
    lte: 9999
  }];

  // entity_type echoes the requested Australian entity class.
  ReportingEntityType entity_type = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];

  // status identifies the exact reporting action available in this build.
  ReportingCapabilityStatus status = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];

  // app_version pins this capability answer to the exact current core build.
  string app_version = 5 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 128
  }];

  // summary is bounded user-facing text describing the support boundary.
  string summary = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];

  // limitations contains at most eight bounded user-facing qualifications.
  repeated string limitations = 7 [(buf.validate.field).repeated = {
    max_items: 8
    items: {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  }];

  // modes contains the authoritative independently evaluated four-mode support boundary.
  repeated ReportingModeCapability modes = 8 [(buf.validate.field).repeated = {
    min_items: 4
    max_items: 4
  }];
}

// GetReportingCapabilityResponse returns one exact build-pinned capability.
message GetReportingCapabilityResponse {
  // capability is the immutable support boundary for the requested key.
  ReportingCapability capability = 1 [(buf.validate.field).required = true];
}

// ReportingCapabilityService exposes reporting support before workspace setup or authentication.
service ReportingCapabilityService {
  // GetReportingCapability returns one read-only build-pinned capability answer.
  rpc GetReportingCapability(GetReportingCapabilityRequest) returns (GetReportingCapabilityResponse);
}
