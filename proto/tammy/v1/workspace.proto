message ListPreRestoreArchivesResponse {
  // archives is a bounded stable page.
  repeated PreRestoreArchive archives = 1 [(buf.validate.field).repeated.max_items = 200];

  // page describes continuation of the same stable snapshot.
  PageInfo page = 2 [(buf.validate.field).required = true];
}

// TransferOwnershipRequest changes the sole owner and invalidates sessions in one audited command.
message TransferOwnershipRequest {
  // command_context carries a UUID idempotency key and new purpose-bound factor assertion.
  CommandContext command_context = 1 [(buf.validate.field).required = true];

  // workspace_id is an opaque UUIDv7 string.
  string workspace_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];

  // expected_version prevents stale ownership changes.
  uint64 expected_version = 3 [(buf.validate.field).uint64.gte = 1];

  // target_user_id must identify an active workspace administrator.
  string target_user_id = 4 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];

  // acknowledge_verification_effect must be explicitly present and true.
  optional bool acknowledge_verification_effect = 5;
}

// TransferOwnershipResponse returns the committed workspace projection before it closes.
message TransferOwnershipResponse {
  // workspace reflects the new owner and advanced version.
  Workspace workspace = 1 [(buf.validate.field).required = true];
}

// WorkspaceService exposes secure local workspace lifecycle, backup, restore, and ownership use cases.
service WorkspaceService {
  // CreateWorkspace creates pending encrypted setup and returns one-time recovery material.
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);

  // ConfirmRecovery is a fresh rate-limited setup challenge.
  rpc ConfirmRecovery(ConfirmRecoveryRequest) returns (ConfirmRecoveryResponse);

  // UnlockWorkspace is a fresh rate-limited passphrase or remembered-key challenge.
  rpc UnlockWorkspace(UnlockWorkspaceRequest) returns (UnlockWorkspaceResponse);

  // LockWorkspace closes SQLite, invalidates the session, and zeroes the in-memory DEK.
  rpc LockWorkspace(LockWorkspaceRequest) returns (LockWorkspaceResponse);

  // ForgetRememberedWorkspace removes the unexpired OS-keystore item.
  rpc ForgetRememberedWorkspace(ForgetRememberedWorkspaceRequest) returns (ForgetRememberedWorkspaceResponse);

  // GetWorkspaceState returns the bounded current installation projection.
  rpc GetWorkspaceState(GetWorkspaceStateRequest) returns (GetWorkspaceStateResponse);

  // ChangePassphrase rewraps the existing DEK after current passphrase and new factor proof.
  rpc ChangePassphrase(ChangePassphraseRequest) returns (ChangePassphraseResponse);

  // RecoverWorkspace performs closed-workspace break glass and sets a new passphrase.
  rpc RecoverWorkspace(RecoverWorkspaceRequest) returns (RecoverWorkspaceResponse);

  // EstablishMovedWorkspaceTrust verifies the audit chain and creates a new OS mirror baseline.
  rpc EstablishMovedWorkspaceTrust(EstablishMovedWorkspaceTrustRequest) returns (EstablishMovedWorkspaceTrustResponse);

  // BackupWorkspace starts a restart-safe encrypted backup job.
  rpc BackupWorkspace(BackupWorkspaceRequest) returns (BackupWorkspaceResponse);

  // CancelBackup elects cancellation before the verified destination rename.
  rpc CancelBackup(CancelBackupRequest) returns (CancelBackupResponse);

  // GetBackupJob returns one bounded persisted backup job.
  rpc GetBackupJob(GetBackupJobRequest) returns (GetBackupJobResponse);

  // ListBackupJobs returns a stable bounded page of persisted backup jobs.
  rpc ListBackupJobs(ListBackupJobsRequest) returns (ListBackupJobsResponse);

  // RestoreWorkspace starts or resumes one external-journal staged restore.
  rpc RestoreWorkspace(RestoreWorkspaceRequest) returns (RestoreWorkspaceResponse);

  // GetRestoreStatus returns one fsync'd external-journal projection.
  rpc GetRestoreStatus(GetRestoreStatusRequest) returns (GetRestoreStatusResponse);

  // ExportPreRestoreArchive starts an authorized encrypted predecessor-evidence export.
  rpc ExportPreRestoreArchive(ExportPreRestoreArchiveRequest) returns (ExportPreRestoreArchiveResponse);

  // CancelPreRestoreArchiveExport elects cancellation before verified destination rename.
  rpc CancelPreRestoreArchiveExport(CancelPreRestoreArchiveExportRequest) returns (CancelPreRestoreArchiveExportResponse);

  // RetryPreRestoreArchiveExport reauthorizes one retryable job with a newly approved destination.
  rpc RetryPreRestoreArchiveExport(RetryPreRestoreArchiveExportRequest) returns (RetryPreRestoreArchiveExportResponse);

  // GetPreRestoreArchiveExportJob returns one bounded persisted export job.
  rpc GetPreRestoreArchiveExportJob(GetPreRestoreArchiveExportJobRequest) returns (GetPreRestoreArchiveExportJobResponse);

  // ListPreRestoreArchiveExportJobs returns a stable bounded export-job page.
  rpc ListPreRestoreArchiveExportJobs(ListPreRestoreArchiveExportJobsRequest) returns (ListPreRestoreArchiveExportJobsResponse);

  // DeletePreRestoreArchive deletes eligible predecessor evidence after password, factor, reason, and age checks.
  rpc DeletePreRestoreArchive(DeletePreRestoreArchiveRequest) returns (DeletePreRestoreArchiveResponse);

  // GetPreRestoreArchive returns retained encrypted-evidence metadata only.
  rpc GetPreRestoreArchive(GetPreRestoreArchiveRequest) returns (GetPreRestoreArchiveResponse);

  // ListPreRestoreArchives returns a stable bounded archive page.
  rpc ListPreRestoreArchives(ListPreRestoreArchivesRequest) returns (ListPreRestoreArchivesResponse);

  // TransferOwnership changes the owner, supersedes verification, invalidates sessions, and closes the workspace.
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse);
}
