  string job_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];

  // expected_version prevents cancellation of a changed job.
  uint64 expected_version = 3 [(buf.validate.field).uint64.gte = 1];
}

// CancelBackupResponse returns the elected terminal or already-committed job.
message CancelBackupResponse {
