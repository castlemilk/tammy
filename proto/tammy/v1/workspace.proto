  string operation_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}

// GetRestoreStatusResponse returns the latest fsync'd restore status.
message GetRestoreStatusResponse {
  // status contains hashes and lifecycle metadata but no credentials or accounting content.
  RestoreStatus status = 1 [(buf.validate.field).required = true];
}

