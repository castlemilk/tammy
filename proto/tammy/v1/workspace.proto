// DeletePreRestoreArchiveRequest deletes eligible retained evidence after all high-risk gates pass.
message DeletePreRestoreArchiveRequest {
  // command_context carries a UUID idempotency key and new purpose-bound factor assertion.
  CommandContext command_context = 1 [(buf.validate.field).required = true];

  // archive_id identifies retained encrypted evidence.
  string archive_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];

  // expected_version prevents stale deletion.
  uint64 expected_version = 3 [(buf.validate.field).uint64.gte = 1];

  // administrator_password is transient proof and never retained or logged.
  SecretInput administrator_password = 4 [(buf.validate.field).required = true];

  // reason is mandatory bounded audit-safe text and must not contain secrets.
  string reason = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

// DeletePreRestoreArchiveResponse returns the audited tombstone projection.
message DeletePreRestoreArchiveResponse {
  // archive has the terminal DELETED lifecycle state.
  PreRestoreArchive archive = 1 [(buf.validate.field).required = true];
}

// GetPreRestoreArchiveRequest requests one bounded retained archive projection.
message GetPreRestoreArchiveRequest {
