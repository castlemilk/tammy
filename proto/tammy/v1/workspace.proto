// RestoreWorkspaceRequest starts or resumes one external-journal restore operation.
message RestoreWorkspaceRequest {
  // operation_id is a caller-generated UUIDv7 scoped to the target workspace.
  string operation_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];

  // target_workspace_id is the encrypted workspace being replaced.
  string target_workspace_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];

  // backup_file is an approved encrypted backup capability.
  ApprovedFileRef backup_file = 3 [(buf.validate.field).required = true];

  // backup_passphrase is transient and never retained or logged.
  SecretInput backup_passphrase = 4 [(buf.validate.field).required = true];

  // proof selects staged administrator authentication or staged recovery break glass.
  oneof proof {
    // administrator_proof authenticates an active staged administrator with fresh TOTP.
    RestoreAdministratorProof administrator_proof = 5;

    // recovery_proof performs the staged audited administrator reset.
    RestoreRecoveryProof recovery_proof = 6;
  }
}

// RestoreWorkspaceResponse returns the fsync'd external-journal projection.
message RestoreWorkspaceResponse {
  // status is deterministic for an exact operation replay.
  RestoreStatus status = 1 [(buf.validate.field).required = true];
}

// GetRestoreStatusRequest requests one external-journal operation projection.
message GetRestoreStatusRequest {
