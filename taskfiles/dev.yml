version: '3'

tasks:
  core:
    desc: Build the supported native core for local desktop development.
    summary: |
      Development uses persistent local-core-development data and development-memory-anchor
      resets; it is not production or package evidence.
    preconditions:
      - sh: >-
          mise exec -- node -e 'const target = process.argv[1] ?? `${process.platform}/${process.arch}`; if (!new Set(["darwin/arm64", "win32/x64"]).has(target)) { console.error(`UNSUPPORTED_SQLCIPHER_TARGET:${target}`); process.exit(1); }'
        msg: The local SQLCipher development target is unsupported.
    cmds:
      - mise exec -- pnpm core:build

  launch:
    desc: Start the supported local Electron development application.
    summary: |
      Development uses persistent local-core-development data and development-memory-anchor
      resets; it is not production or package evidence.
    preconditions:
      - sh: >-
          mise exec -- node -e 'const target = process.argv[1] ?? `${process.platform}/${process.arch}`; if (!new Set(["darwin/arm64", "win32/x64"]).has(target)) { console.error(`UNSUPPORTED_SQLCIPHER_TARGET:${target}`); process.exit(1); }'
        msg: The local SQLCipher development target is unsupported.
    cmds:
      - mise exec -- pnpm desktop:start
