version: '3'

tasks:
  verify:
    desc: Build and verify an ordinary supported local desktop package.
    summary: |
      Authenticates the local package artifact, source manifest, native core, and package
      signatures/resources. It deliberately excludes runtime launch, isolated Electron
      userData, and orphan proof; package:e2e owns that evidence. This ordinary local
      package is not production or App Store evidence.
    preconditions:
      - sh: >-
          mise exec -- node -e 'const target = process.argv[1] ?? `${process.platform}/${process.arch}`; if (!new Set(["darwin/arm64", "win32/x64"]).has(target)) { console.error(`UNSUPPORTED_SQLCIPHER_TARGET:${target}`); process.exit(1); }'
        msg: Package verification requires darwin/arm64 or win32/x64.
    cmds:
      - mise exec -- pnpm desktop:package

  e2e:
    desc: Run packaged Electron acceptance on a supported native target.
    summary: |
      Authenticates the source manifest, native core, and package signatures/resources;
      it provides isolated Electron userData, runtime, and orphan evidence through packaged
      acceptance. This ordinary local package is not production or App Store evidence.
    preconditions:
      - sh: >-
          mise exec -- node -e 'const target = process.argv[1] ?? `${process.platform}/${process.arch}`; if (!new Set(["darwin/arm64", "win32/x64"]).has(target)) { console.error(`UNSUPPORTED_SQLCIPHER_TARGET:${target}`); process.exit(1); }'
        msg: Packaged E2E requires darwin/arm64 or win32/x64.
    cmds:
      - mise exec -- pnpm desktop:e2e
