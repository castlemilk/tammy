version: '3'

tasks:
  launch-accounting-fresh:
    internal: true
    desc: Launch accounting with a new retained local data root.
    summary: |
      The simulator is synthetic and network-disabled. EVTE is non-production and requires signed external inputs.
      No live credential is accepted by Task. BAS remains preparation-only with no submit or lodge action.
      Production SBR is unavailable. This launches ordinary accounting with an isolated retained root.
    cmds:
      - mise exec -- node scripts/launch-local-scenario.mjs accounting-fresh

  launch-simulator:
    internal: true
    desc: Launch the synthetic network-disabled simulator with isolated retained user data.
    summary: |
      The simulator is synthetic and network-disabled. EVTE is non-production and requires signed external inputs.
      No live credential is accepted by Task. BAS remains preparation-only with no submit or lodge action.
      Production SBR is unavailable. The retained simulator root is printed after exit.
    preconditions:
      - sh: >-
          mise exec -- node -e 'const target = `${process.platform}/${process.arch}`; if (target !== "darwin/arm64") { console.error(`UNSUPPORTED_SBR_TARGET:${target}`); process.exit(1); }'
        msg: UNSUPPORTED_SBR_TARGET:{{OS}}/{{ARCH}}
    cmds:
      - mise exec -- node scripts/launch-local-scenario.mjs sbr-simulator

  launch-evte:
    internal: true
    desc: Validate fixed signed inputs and fail closed until EVTE integration exists.
    summary: |
      The simulator is synthetic and network-disabled. EVTE is non-production and requires signed external inputs.
      No live credential is accepted by Task. BAS remains preparation-only with no submit or lodge action.
      Production SBR is unavailable. Installed signed inputs must pass the fixed-path checker,
      and the EVTE process owner remains deliberately unavailable.
    preconditions:
      - sh: >-
          mise exec -- node -e 'const target = `${process.platform}/${process.arch}`; if (target !== "darwin/arm64") { console.error(`UNSUPPORTED_SBR_TARGET:${target}`); process.exit(1); }'
        msg: UNSUPPORTED_SBR_TARGET:{{OS}}/{{ARCH}}
    cmds:
      - mise exec -- node scripts/check-sbr-registration.mjs
      - mise exec -- node scripts/launch-local-scenario.mjs sbr-evte

  run-doctor:
    internal: true
    desc: Report static EVTE gaps, then launch authenticated in-app doctor readiness.
    summary: |
      The simulator is synthetic and network-disabled. EVTE is non-production and requires signed external inputs.
      No live credential is accepted by Task. BAS remains preparation-only with no submit or lodge action.
      Production SBR is unavailable. Static preflight runs first; after unlock and sign-in the
      app opens /settings/sbr?doctor=1 under explicit simulator authority.
    preconditions:
      - sh: >-
          mise exec -- node -e 'const target = `${process.platform}/${process.arch}`; if (target !== "darwin/arm64") { console.error(`UNSUPPORTED_SBR_TARGET:${target}`); process.exit(1); }'
        msg: UNSUPPORTED_SBR_TARGET:{{OS}}/{{ARCH}}
    cmds:
      - mise exec -- node scripts/check-sbr-registration.mjs --doctor-preflight
      - mise exec -- node scripts/launch-local-scenario.mjs sbr-doctor

  run-registration-check:
    internal: true
    desc: Validate exact installed signed inputs and print a bounded redacted readiness report.
    summary: |
      The simulator is synthetic and network-disabled. EVTE is non-production and requires signed external inputs.
      No live credential is accepted by Task. BAS remains preparation-only with no submit or lodge action.
      Production SBR is unavailable. Missing, unsafe, invalid, or unauthenticated signed inputs
      remain blocked and the command exits non-zero.
    preconditions:
      - sh: >-
          mise exec -- node -e 'const target = `${process.platform}/${process.arch}`; if (target !== "darwin/arm64") { console.error(`UNSUPPORTED_SBR_TARGET:${target}`); process.exit(1); }'
        msg: UNSUPPORTED_SBR_TARGET:{{OS}}/{{ARCH}}
    cmds:
      - mise exec -- node scripts/check-sbr-registration.mjs

  run-test:
    internal: true
    desc: Run the complete local helper, core, schema, desktop, policy, and contract SBR graph.
    summary: |
      The simulator is synthetic and network-disabled. EVTE is non-production and requires signed external inputs.
      No live credential is accepted by Task. BAS remains preparation-only with no submit or lodge action.
      Production SBR is unavailable. These checks prove only the local simulator boundary.
      Signed Keychain and native security-bookmark integrations remain separate opt-in checks.
    preconditions:
      - sh: >-
          mise exec -- node -e 'const target = `${process.platform}/${process.arch}`; if (target !== "darwin/arm64") { console.error(`UNSUPPORTED_SBR_TARGET:${target}`); process.exit(1); }'
        msg: UNSUPPORTED_SBR_TARGET:{{OS}}/{{ARCH}}
    cmds:
      - mise exec -- pnpm sqlcipher:test
      - mise exec -- pnpm sqlcipher:build
      - mise exec -- go test -race ./services/sbr-helper/... -count=1
      - mise exec -- go test -race ./services/core/internal/sbrprofile ./services/core/internal/sbrhelper ./services/core/internal/sbr -count=1
      - mise exec -- go test -race -tags tammy_sqlcipher ./services/core/internal/storage/migrations ./services/core/internal/sbr ./services/core/internal/backup ./services/core/internal/restore ./services/core/internal/app ./services/core/cmd/tammy-core -count=1
      - mise exec -- node --test scripts/sbr-profile-schema.test.mjs scripts/sbr-component-schema.test.mjs scripts/sbr-registration-schema.test.mjs scripts/check-sbr-registration.test.mjs scripts/write-sbr-evidence.test.mjs scripts/test-sbr-security-bookmark.test.mjs
      - mise exec -- pnpm --dir apps/desktop exec vitest run --maxWorkers=1 src/preload/index.test.ts src/main/core-client.test.ts src/main/rpc-router.test.ts src/main/ipc.test.ts src/main/sbr-file-intake.test.ts src/main/index-production.test.ts src/main/index.test.ts src/main/playwright-config.test.ts src/main/launch-scenario.test.ts src/renderer/app.test.tsx src/renderer/app-shell/simulator-banner.test.tsx src/renderer/features/sbr/sbr-readiness-screen.test.tsx src/renderer/features/sbr/machine-credential-form.test.tsx src/renderer/features/sbr/product-id-form.test.tsx src/renderer/features/sbr/organisation-verification-form.test.tsx src/renderer/features/sbr/sbr-simulator-panel.test.tsx
      - mise exec -- node --test scripts/check-slice-one-coverage-policy.test.mjs scripts/check-e2e-coverage.test.mjs
      - mise exec -- pnpm --dir apps/desktop exec vitest run --maxWorkers=1 src/main/e2e-process-check.test.ts src/main/sbr-result.test.ts
      - mise exec -- pnpm contracts

  run-evidence:
    internal: true
    desc: Consume the existing exact-revision packaged PASSED result into redacted evidence.
    summary: |
      The simulator is synthetic and network-disabled. EVTE is non-production and requires signed external inputs.
      No live credential is accepted by Task. BAS remains preparation-only with no submit or lodge action.
      Production SBR is unavailable. This does not rerun packaged tests; package:e2e must first
      create the current-revision 0600 PASSED result at the repository-owned fixed location.
    preconditions:
      - sh: >-
          mise exec -- node -e 'const target = `${process.platform}/${process.arch}`; if (target !== "darwin/arm64") { console.error(`UNSUPPORTED_SBR_TARGET:${target}`); process.exit(1); }'
        msg: UNSUPPORTED_SBR_TARGET:{{OS}}/{{ARCH}}
    cmds:
      - mise exec -- node scripts/write-sbr-evidence.mjs
